<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale Aziendale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --primary:#1e5cb3; --primary-dark:#154585; --bg:#f4f6f9; --card:#ffffff;
    --border:#e1e5ea; --text:#1c2530; --muted:#66707d; --danger:#c0392b; --ok:#1f8b4c;
    --warn:#b8860b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{font-size:18px;margin:0;font-weight:600;}
  header .user-box{font-size:13px;display:flex;align-items:center;gap:12px;}
  button{cursor:pointer;border:none;border-radius:6px;padding:8px 14px;font-size:14px;background:var(--primary);color:#fff;}
  button:hover{background:var(--primary-dark);}
  button.secondary{background:#eef1f5;color:var(--text);}
  button.secondary:hover{background:#dfe4ea;}
  button.danger{background:var(--danger);}
  nav{background:#fff;border-bottom:1px solid var(--border);display:flex;gap:4px;padding:0 16px;overflow-x:auto;}
  nav button{background:transparent;color:var(--muted);border-radius:0;padding:12px 16px;font-weight:500;white-space:nowrap;}
  nav button.active{color:var(--primary);border-bottom:2px solid var(--primary);}
  nav button:hover{background:#f0f3f7;color:var(--primary);}
  main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
  .card h2{margin-top:0;font-size:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  tr:hover td{background:#f8fafc;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;color:var(--text);}
  textarea{min-height:60px;font-family:inherit;}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
  .badge.disponibile{background:#e3f6ea;color:var(--ok);}
  .badge.in_uso{background:#e5edfa;color:var(--primary);}
  .badge.in_revisione,.badge.da_riparare{background:#fdf3d8;color:var(--warn);}
  .badge.danneggiato,.badge.fuori_servizio{background:#fbe3e1;color:var(--danger);}
  .badge.aperto{background:#e5edfa;color:var(--primary);}
  .badge.in_corso{background:#fdf3d8;color:var(--warn);}
  .badge.chiuso{background:#e3f6ea;color:var(--ok);}
  .badge.annullato{background:#fbe3e1;color:var(--danger);}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:380px;}
  .login-box h1{font-size:20px;text-align:center;margin-bottom:4px;}
  .login-box p.sub{text-align:center;color:var(--muted);font-size:13px;margin-top:0;margin-bottom:20px;}
  .login-box label{margin-top:12px;}
  .login-box button{width:100%;margin-top:18px;padding:10px;}
  .switch-link{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);}
  .switch-link a{color:var(--primary);cursor:pointer;text-decoration:none;}
  .msg{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;}
  .msg.error{background:#fbe3e1;color:var(--danger);}
  .msg.ok{background:#e3f6ea;color:var(--ok);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
  .pill-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .pill-select button{background:#eef1f5;color:var(--text);padding:6px 12px;font-size:12px;}
  .pill-select button.active{background:var(--primary);color:#fff;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;}
  .kpi .num{font-size:26px;font-weight:700;color:var(--primary);}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  select[multiple]{height:auto;}
  .close-x{background:transparent;color:var(--muted);padding:4px 8px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:10px;padding:20px;max-width:520px;width:100%;max-height:85vh;overflow:auto;}
  .modal h3{margin-top:0;}
  small.hint{color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// CONFIGURAZIONE SUPABASE
// ============================================================
const SUPABASE_URL = "https://pvlzvubxwbwtsqgmxdvt.supabase.co";
const SUPABASE_KEY = "sb_publishable_BE-eqQHoW5Vaxy3HURnt6w_wU2sN6dW";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// STATO GLOBALE
// ============================================================
let state = {
  session: null,
  view: "dashboard",
  data: { clienti: [], cantieri: [], articoli: [], pezzi: [], serviceOrders: [], righe: [], profiles: [], listino: [], preventivi: [], preventivoRighe: [], fornitori: [], fatture: [], movimenti: [], documenti: [] },
  authMode: "login", // login | signup
  soAperto: null, // id service order aperto nel dettaglio
  preventivoAperto: null, // id preventivo aperto nel dettaglio
};

const app = document.getElementById("app");

function statoLabel(s){
  const map = {
    disponibile:"Disponibile", in_uso:"In uso", in_revisione:"In revisione",
    da_riparare:"Da riparare", danneggiato:"Danneggiato", fuori_servizio:"Fuori servizio",
    attivo:"Attivo", sospeso:"Sospeso", concluso:"Concluso",
    aperto:"Aperto", in_corso:"In corso", chiuso:"Chiuso", annullato:"Annullato"
  };
  return map[s] || s;
}
function badge(s){ return `<span class="badge ${s}">${statoLabel(s)}</span>`; }
function fmtDate(d){ if(!d) return "-"; const dt=new Date(d); return dt.toLocaleDateString("it-IT")+" "+dt.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
function escapeHtml(str){ if(str==null) return ""; return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function soNumero(n){ return n==null? "------" : String(n).padStart(6,"0"); }

// ============================================================
// MODALE GENERICO (usato per Modifica e per i Documenti)
// ============================================================
function openModal(title, bodyHtml, onMount){
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.id = "modal-bg";
  bg.innerHTML = `<div class="modal"><button type="button" class="close-x" id="modal-close" style="float:right;">✕</button><h3>${escapeHtml(title)}</h3><div id="modal-body">${bodyHtml}</div></div>`;
  document.body.appendChild(bg);
  document.getElementById("modal-close").onclick = closeModal;
  bg.onclick = (e)=>{ if(e.target===bg) closeModal(); };
  if(onMount) onMount(document.getElementById("modal-body"));
}
function closeModal(){
  const bg = document.getElementById("modal-bg");
  if(bg) bg.remove();
}
async function confirmDelete(table, id, labelCosa, afterOk){
  if(!confirm(`Eliminare definitivamente ${labelCosa||"questo elemento"}?\nL'operazione non è reversibile.`)) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if(error){ alert("Errore durante l'eliminazione: "+error.message+"\n\n(Solo l'amministratore può eliminare. Se l'errore persiste contatta l'admin.)"); return; }
  closeModal();
  if(afterOk) afterOk();
  render();
}

// ============================================================
// AUTH
// ============================================================
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((_event, session)=>{
    state.session = session;
    render();
  });
  render();
}

async function handleLogin(email, password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  return error;
}
async function handleSignup(email, password, fullName){
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name: fullName } } });
  return error;
}
async function handleLogout(){
  await sb.auth.signOut();
  state.view = "dashboard";
  render();
}

// ============================================================
// CARICAMENTO DATI
// ============================================================
async function loadAll(){
  const [clienti, cantieri, articoli, pezzi, serviceOrders, righe, profiles, listino, preventivi, preventivoRighe, fornitori, fatture, movimenti, documenti] = await Promise.all([
    sb.from("clienti").select("*").order("created_at",{ascending:false}),
    sb.from("cantieri").select("*").order("created_at",{ascending:false}),
    sb.from("articoli").select("*").order("created_at",{ascending:false}),
    sb.from("pezzi").select("*").order("created_at",{ascending:false}),
    sb.from("service_orders").select("*").order("data_apertura",{ascending:false}),
    sb.from("service_order_righe").select("*").order("data",{ascending:false}),
    sb.from("profiles").select("*").order("created_at",{ascending:false}),
    sb.from("listino_prezzi").select("*"),
    sb.from("preventivi").select("*").order("data_creazione",{ascending:false}),
    sb.from("preventivo_righe").select("*"),
    sb.from("fornitori").select("*").order("created_at",{ascending:false}),
    sb.from("fatture").select("*").order("data_emissione",{ascending:false}),
    sb.from("movimenti_cassa").select("*").order("data",{ascending:false}),
    sb.from("documenti").select("*").order("created_at",{ascending:false}),
  ]);
  state.data.clienti = clienti.data || [];
  state.data.cantieri = cantieri.data || [];
  state.data.articoli = articoli.data || [];
  state.data.pezzi = pezzi.data || [];
  state.data.serviceOrders = serviceOrders.data || [];
  state.data.righe = righe.data || [];
  state.data.profiles = profiles.data || [];
  state.data.listino = listino.data || [];
  state.data.preventivi = preventivi.data || [];
  state.data.preventivoRighe = preventivoRighe.data || [];
  state.data.fornitori = fornitori.data || [];
  state.data.fatture = fatture.data || [];
  state.data.movimenti = movimenti.data || [];
  state.data.documenti = documenti.data || [];
}

function clienteNome(id){ const c = state.data.clienti.find(x=>x.id===id); return c ? c.ragione_sociale : "-"; }
function cantiereNome(id){ const c = state.data.cantieri.find(x=>x.id===id); return c ? c.nome : "-"; }
function articoloLabel(id){ const a = state.data.articoli.find(x=>x.id===id); return a ? `${a.codice} - ${a.descrizione}` : "-"; }
function pezzoLabel(id){ const p = state.data.pezzi.find(x=>x.id===id); return p ? `${p.dtr} (${articoloLabel(p.articolo_id)})` : "-"; }
function myProfile(){ return state.session ? state.data.profiles.find(p=>p.id===state.session.user.id) : null; }
function myRole(){ const p = myProfile(); return p ? p.ruolo : null; }
function ruoloLabel(r){ const map={admin:"Amministratore",magazzino:"Magazzino",commerciale:"Commerciale",contabile:"Contabile",shareholder:"Socio/Azionista"}; return map[r]||r; }
function prezzoArticolo(articoloId){ return state.data.listino.find(l=>l.articolo_id===articoloId) || null; }
function fmtMoney(n){ if(n==null || isNaN(n)) return "-"; return Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function tipoPrezzoLabel(t){ const map={vendita:"Vendita",noleggio_giornaliero:"Noleggio giorno",noleggio_settimanale:"Noleggio settimana",noleggio_mensile:"Noleggio mese"}; return map[t]||t; }
function totaleRiga(r){ return r.quantita * r.prezzo_unitario * (1 - (r.sconto_percentuale||0)/100); }
function totalePreventivo(preventivoId){
  const righe = state.data.preventivoRighe.filter(r=>r.preventivo_id===preventivoId);
  const sub = righe.reduce((s,r)=>s+totaleRiga(r),0);
  const prev = state.data.preventivi.find(p=>p.id===preventivoId);
  const scontoGlobale = prev ? (prev.sconto_percentuale||0) : 0;
  return sub * (1 - scontoGlobale/100);
}
function statoPreventivoLabelClass(s){ const map={bozza:"in_revisione",inviato:"in_uso",accettato:"chiuso",rifiutato:"danneggiato"}; return map[s]||s; }
function statoPreventivoLabel(s){ const map={bozza:"Bozza",inviato:"Inviato",accettato:"Accettato",rifiutato:"Rifiutato"}; return map[s]||s; }
function fornitoreNome(id){ const f = state.data.fornitori.find(x=>x.id===id); return f ? f.ragione_sociale : "-"; }
function isScaduta(f){ return f.stato==="non_pagata" && f.data_scadenza && new Date(f.data_scadenza) < new Date(new Date().toDateString()); }
function statoFatturaEffettivo(f){ return isScaduta(f) ? "scaduta" : f.stato; }
function statoFatturaLabel(s){ const map={non_pagata:"Non pagata",pagata:"Pagata",insoluto:"Insoluto",scaduta:"Scaduta"}; return map[s]||s; }
function statoFatturaClass(s){ const map={non_pagata:"in_uso",pagata:"chiuso",insoluto:"danneggiato",scaduta:"da_riparare"}; return map[s]||s; }
function fmtDateOnly(d){ if(!d) return "-"; return new Date(d).toLocaleDateString("it-IT"); }

// ============================================================
// RENDER PRINCIPALE
// ============================================================
async function render(){
  if(!state.session){
    renderLogin();
    return;
  }
  await loadAll();
  const ruolo = myRole();
  const opRoles = ["magazzino","commerciale","contabile","admin"];
  const isOperativo = opRoles.includes(ruolo); // uno shareholder non è un utente operativo
  const vedeMagazzino = isOperativo && ruolo!=="contabile"; // contabile non vede magazzino/pezzi/service order
  const vedePrezzi = isOperativo && ruolo!=="magazzino"; // il magazzino non vede prezzi/listino/preventivi
  const vedeContabilita = ["contabile","admin"].includes(ruolo);
  const vedeAndamento = ["shareholder","admin"].includes(ruolo);
  const navItems = [["dashboard","Dashboard",isOperativo],
    ["clienti","Clienti",isOperativo],
    ["cantieri","Cantieri",isOperativo],
    ["magazzino","Magazzino",vedeMagazzino],
    ["pezzi","Pezzi (DTR)",vedeMagazzino],
    ["listino","Listino prezzi",vedePrezzi],
    ["preventivi","Preventivi",vedePrezzi],
    ["serviceorder","Service Order",vedeMagazzino],
    ["fornitori","Fornitori",vedeContabilita],
    ["fatture","Fatture",vedeContabilita],
    ["cassa","Cassa",vedeContabilita],
    ["andamento","Andamento azienda",vedeAndamento],
    ["utenti","Utenti",ruolo==="admin"]];
  if(!navItems.find(n=>n[0]===state.view && n[2])) state.view = (vedeAndamento && !isOperativo) ? "andamento" : "dashboard";

  app.innerHTML = `
    <header>
      <h1>Gestionale Aziendale</h1>
      <div class="user-box">
        <span>${escapeHtml(state.session.user.email)} ${ruolo? `<span class="badge in_uso">${escapeHtml(ruoloLabel(ruolo))}</span>` : ""}</span>
        <button class="secondary" id="btn-logout">Esci</button>
      </div>
    </header>
    <nav id="main-nav">${navItems.filter(n=>n[2]).map(n=>navBtn(n[0],n[1])).join("")}</nav>
    <main id="main-content"><div class="empty">Caricamento...</div></main>
  `;
  document.getElementById("btn-logout").onclick = handleLogout;
  document.querySelectorAll("#main-nav button").forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.view; state.soAperto=null; state.preventivoAperto=null; render(); };
  });

  const main = document.getElementById("main-content");
  if(state.view==="dashboard") main.innerHTML = viewDashboard();
  if(state.view==="clienti") { main.innerHTML = viewClienti(); wireClienti(); }
  if(state.view==="cantieri") { main.innerHTML = viewCantieri(); wireCantieri(); }
  if(state.view==="magazzino") { main.innerHTML = viewMagazzino(); wireMagazzino(); }
  if(state.view==="pezzi") { main.innerHTML = viewPezzi(); wirePezzi(); }
  if(state.view==="listino") { main.innerHTML = viewListino(); wireListino(); }
  if(state.view==="preventivi") { main.innerHTML = viewPreventivi(); wirePreventivi(); }
  if(state.view==="serviceorder") { main.innerHTML = viewServiceOrder(); wireServiceOrder(); }
  if(state.view==="fornitori") { main.innerHTML = viewFornitori(); wireFornitori(); }
  if(state.view==="fatture") { main.innerHTML = viewFatture(); wireFatture(); }
  if(state.view==="cassa") { main.innerHTML = viewCassa(); wireCassa(); }
  if(state.view==="utenti") { main.innerHTML = viewUtenti(); wireUtenti(); }
  if(state.view==="andamento") { main.innerHTML = viewAndamento(); wireAndamento(); }
}

function navBtn(view, label){
  return `<button data-view="${view}" class="${state.view===view?'active':''}">${label}</button>`;
}

// ============================================================
// LOGIN / SIGNUP
// ============================================================
function renderLogin(){
  const isSignup = state.authMode === "signup";
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h1>Gestionale Aziendale</h1>
        <p class="sub">${isSignup? "Crea il tuo account" : "Accedi al tuo account"}</p>
        <div id="login-msg"></div>
        <form id="login-form">
          ${isSignup? `<label>Nome completo</label><input type="text" id="f-name" required>` : ""}
          <label>Email</label>
          <input type="email" id="f-email" required>
          <label>Password</label>
          <input type="password" id="f-password" required minlength="6">
          <button type="submit">${isSignup? "Registrati" : "Accedi"}</button>
        </form>
        <div class="switch-link">
          ${isSignup
            ? `Hai già un account? <a id="switch-mode">Accedi</a>`
            : `Non hai un account? <a id="switch-mode">Registrati</a>`}
        </div>
      </div>
    </div>
  `;
  document.getElementById("switch-mode").onclick = ()=>{
    state.authMode = isSignup? "login" : "signup";
    renderLogin();
  };
  document.getElementById("login-form").onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById("f-email").value.trim();
    const password = document.getElementById("f-password").value;
    const msgBox = document.getElementById("login-msg");
    msgBox.innerHTML = "";
    let error;
    if(isSignup){
      const fullName = document.getElementById("f-name").value.trim();
      error = await handleSignup(email, password, fullName);
      if(!error){
        msgBox.innerHTML = `<div class="msg ok">Registrazione avvenuta. Controlla la tua email se richiesta conferma, poi accedi.</div>`;
        state.authMode = "login";
        setTimeout(renderLogin, 1800);
        return;
      }
    } else {
      error = await handleLogin(email, password);
    }
    if(error){
      msgBox.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
    }
  };
}

// ============================================================
// DASHBOARD
// ============================================================
function valoreMagazzino(){
  return state.data.pezzi.reduce((tot,p)=>{
    const l = prezzoArticolo(p.articolo_id);
    const v = l && l.prezzo_vendita!=null ? Number(l.prezzo_vendita) : 0;
    return tot + v;
  },0);
}
function viewDashboard(){
  const d = state.data;
  const ruolo = myRole();
  const soAperti = d.serviceOrders.filter(s=>s.stato==="aperto"||s.stato==="in_corso").length;
  const fuoriMagazzino = d.pezzi.filter(p=>p.stato==="in_uso").length;
  const daRevisionare = d.pezzi.filter(p=>p.stato==="in_revisione"||p.stato==="da_riparare").length;
  const cantieriAttivi = d.cantieri.filter(c=>c.stato==="attivo").length;
  const vedeContabilita = ["contabile","admin"].includes(ruolo);
  const vedePrezzi = ruolo!=="magazzino";
  const daIncassare = d.fatture.filter(f=>f.tipo==="emessa" && f.stato!=="pagata").reduce((s,f)=>s+Number(f.importo_totale),0);
  const scadute = d.fatture.filter(f=>f.tipo==="emessa" && isScaduta(f)).length;
  const preventiviAperti = d.preventivi.filter(p=>p.stato==="bozza"||p.stato==="inviato").length;
  const clientiInattivi = d.clienti.filter(c=>!d.cantieri.some(k=>k.cliente_id===c.id && k.stato==="attivo")).length;
  return `
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${d.clienti.length}</div><div class="lbl">Clienti</div></div>
      <div class="kpi"><div class="num">${cantieriAttivi}</div><div class="lbl">Cantieri attivi</div></div>
      <div class="kpi"><div class="num">${clientiInattivi}</div><div class="lbl">Clienti senza cantieri attivi</div></div>
      <div class="kpi"><div class="num">${d.articoli.length}</div><div class="lbl">Articoli a catalogo</div></div>
      <div class="kpi"><div class="num">${d.pezzi.length}</div><div class="lbl">Pezzi totali (DTR)</div></div>
      <div class="kpi"><div class="num">${fuoriMagazzino}</div><div class="lbl">Pezzi fuori magazzino</div></div>
      <div class="kpi"><div class="num">${daRevisionare}</div><div class="lbl">Da revisionare/riparare</div></div>
      <div class="kpi"><div class="num">${soAperti}</div><div class="lbl">Service Order attivi</div></div>
      ${vedePrezzi? `<div class="kpi"><div class="num">${preventiviAperti}</div><div class="lbl">Preventivi aperti</div></div>
      <div class="kpi"><div class="num">${fmtMoney(valoreMagazzino())}</div><div class="lbl">Valore magazzino (a listino)</div></div>` : ""}
      ${vedeContabilita? `

function viewAndamento(){
  const d = state.data;
  const fattTotale = d.fatture.filter(f=>f.tipo==="emessa").reduce((s,f)=>s+Number(f.importo_totale),0);
  const incassato = d.fatture.filter(f=>f.tipo==="emessa" && f.stato==="pagata").reduce((s,f)=>s+Number(f.importo_totale),0);
  const daIncassare = d.fatture.filter(f=>f.tipo==="emessa" && f.stato!=="pagata").reduce((s,f)=>s+Number(f.importo_totale),0);
  const costi = d.fatture.filter(f=>f.tipo==="ricevuta").reduce((s,f)=>s+Number(f.importo_totale),0);
  const utile = fattTotale - costi;
  const entrateCassa = d.movimenti.filter(m=>m.tipo==="entrata").reduce((s,m)=>s+Number(m.importo),0);
  const usciteCassa = d.movimenti.filter(m=>m.tipo==="uscita").reduce((s,m)=>s+Number(m.importo),0);
  const saldoCassa = entrateCassa - usciteCassa;
  const clientiAttivi = d.clienti.filter(c=>d.cantieri.some(k=>k.cliente_id===c.id && k.stato==="attivo")).length;
  const cantieriAttivi = d.cantieri.filter(c=>c.stato==="attivo").length;
  const soAperti = d.serviceOrders.filter(s=>s.stato==="aperto"||s.stato==="in_corso").length;
  return `
    <div class="card">
      <h2>Andamento dell'azienda</h2>
      <p><small class="hint">Vista di sola lettura riservata a soci/azionisti e amministratore: dati economici e operativi aggregati.</small></p>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${fmtMoney(fattTotale)}</div><div class="lbl">Fatturato totale</div></div>
      <div class="kpi"><div class="num">${fmtMoney(incassato)}</div><div class="lbl">Incassato</div></div>
      <div class="kpi"><div class="num">${fmtMoney(daIncassare)}</div><div class="lbl">Da incassare</div></div>
      <div class="kpi"><div class="num">${fmtMoney(costi)}</div><div class="lbl">Costi (fatture da fornitori)</div></div>
      <div class="kpi"><div class="num">${fmtMoney(utile)}</div><div class="lbl">Utile stimato</div></div>
      <div class="kpi"><div class="num">${fmtMoney(saldoCassa)}</div><div class="lbl">Saldo cassa/banca</div></div>
      <div class="kpi"><div class="num">${fmtMoney(valoreMagazzino())}</div><div class="lbl">Valore magazzino (a listino)</div></div>
      <div class="kpi"><div class="num">${clientiAttivi}</div><div class="lbl">Clienti attivi</div></div>
      <div class="kpi"><div class="num">${cantieriAttivi}</div><div class="lbl">Cantieri attivi</div></div>
      <div class="kpi"><div class="num">${soAperti}</div><div class="lbl">Service Order attivi</div></div>
    </div>
  `;
}

// DOCUMENTI (upload/scansione/foto, legati a cliente o cantiere)
// ============================================================
function renderModaleDocumenti(entitaTipo, entitaId, titolo){
  const docs = state.data.documenti.filter(x=>x.entita_tipo===entitaTipo && x.entita_id===entitaId);
  const ruolo = myRole();
  const puoCaricare = ["commerciale","contabile","admin"].includes(ruolo);
  const body = `
    ${puoCaricare? `
    <form id="form-documento">
      <label>Carica file, scatta una foto o scansiona il documento</label>
      <input type="file" id="doc-file" accept="image/*,application/pdf" capture="environment" required>
      <div style="margin-top:10px;"><button type="submit">Carica documento</button></div>
    </form>` : ""}
    <div id="doc-upload-msg"></div>
    <table style="margin-top:14px;"><thead><tr><th>File</th><th>Caricato il</th><th></th></tr></thead>
    <tbody>
      ${docs.length===0? `<tr><td colspan="3" class="empty">Nessun documento caricato.</td></tr>` : docs.map(doc=>`
        <tr>
          <td><a href="${doc.url}" target="_blank" rel="noopener">${escapeHtml(doc.nome_file)}</a></td>
          <td>${fmtDate(doc.created_at)}</td>
          <td>${ruolo==="admin"? `<button class="secondary btn-elimina-doc" data-id="${doc.id}">Elimina</button>` : ""}</td>
        </tr>
      `).join("")}
    </tbody></table>
  `;
  openModal(titolo, body, (bodyEl)=>{
    const f = bodyEl.querySelector("#form-documento");
    if(f) f.onsubmit = async (e)=>{
      e.preventDefault();
      const input = bodyEl.querySelector("#doc-file");
      const file = input.files[0];
      if(!file) return;
      const msg = bodyEl.querySelector("#doc-upload-msg");
      msg.innerHTML = `<div class="msg">Caricamento in corso...</div>`;
      const path = `${entitaTipo}/${entitaId}/${Date.now()}_${file.name}`;
      const { error: upErr } = await sb.storage.from("documenti").upload(path, file);
      if(upErr){ msg.innerHTML = `<div class="msg error">Errore caricamento: ${escapeHtml(upErr.message)}</div>`; return; }
      const { data: pub } = sb.storage.from("documenti").getPublicUrl(path);
      const { error: insErr } = await sb.from("documenti").insert({
        entita_tipo: entitaTipo, entita_id: entitaId, nome_file: file.name,
        url: pub.publicUrl, content_type: file.type || null, caricato_da: state.session.user.id,
      });
      if(insErr){ msg.innerHTML = `<div class="msg error">Errore salvataggio: ${escapeHtml(insErr.message)}</div>`; return; }
      await loadAll();
      renderModaleDocumenti(entitaTipo, entitaId, titolo);
    };
    bodyEl.querySelectorAll(".btn-elimina-doc").forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm("Eliminare questo documento?")) return;
        const { error } = await sb.from("documenti").delete().eq("id", b.dataset.id);
        if(error){ alert("Errore: "+error.message); return; }
        await loadAll();
        renderModaleDocumenti(entitaTipo, entitaId, titolo);
      };
    });
  });
}

  `;
  openModal("Modifica pezzo", body, (bodyEl)=>{
    bodyEl.querySelector("#btn-annulla-edit").onclick = closeModal;
    const btnDel = bodyEl.querySelector("#btn-elimina-edit");
    if(btnDel) btnDel.onclick = ()=>confirmDelete("pezzi", id, `il pezzo "${p.dtr}"`);
    bodyEl.querySelector("#form-edit-pezzo").onsubmit = async (e)=>{
      e.preventDefault();
      const payload = {
        articolo_id: bodyEl.querySelector("#ep-articolo").value,
        dtr: bodyEl.querySelector("#ep-dtr").value.trim(),
        posizione: bodyEl.querySelector("#ep-posizione").value.trim() || null,
        stato: bodyEl.querySelector("#ep-stato").value,
        updated_at: new Date().toISOString(),
      };
      const { error } = await sb.from("pezzi").update(payload).eq("id", id);
      if(error){ alert("Errore: "+error.message); return; }
      closeModal();
      render();
    };
  });

        <button type="submit">Registra reso</button>

function wireServiceOrderDettaglio(id){
  document.getElementById("btn-torna-so").onclick = ()=>{ state.soAperto=null; render(); };
  const so = state.data.serviceOrders.find(s=>s.id===id);
  const btnChiudi = document.getElementById("btn-chiudi-so");
  if(btnChiudi) btnChiudi.onclick = async ()=>{
    const { error } = await sb.from("service_orders").update({ stato:"chiuso", data_chiusura: new Date().toISOString() }).eq("id", id);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnEliminaSo = document.getElementById("btn-elimina-so");
  if(btnEliminaSo) btnEliminaSo.onclick = ()=>confirmDelete("service_orders", id, `il Service Order #${soNumero(so.numero)}`, ()=>{ state.soAperto=null; });
  const fPrelievo = document.getElementById("form-prelievo");
  if(fPrelievo) fPrelievo.onsubmit = async (e)=>{
    e.preventDefault();
    const pezzoId = document.getElementById("pr-pezzo").value;
    const { error: e1 } = await sb.from("pezzi").update({
      stato:"in_uso", cliente_id: so.cliente_id, cantiere_id: so.cantiere_id, updated_at: new Date().toISOString()
    }).eq("id", pezzoId);
    if(e1){ alert("Errore: "+e1.message); return; }
    const { error: e2 } = await sb.from("service_order_righe").insert({ service_order_id: id, pezzo_id: pezzoId, azione:"prelievo" });
    if(e2){ alert("Errore: "+e2.message); return; }
    render();
  };
  const fReso = document.getElementById("form-reso");
  if(fReso) fReso.onsubmit = async (e)=>{
    e.preventDefault();
    const pezzoId = document.getElementById("re-pezzo").value;
    const nuovoStato = document.getElementById("re-stato").value;
    const { error: e1 } = await sb.from("pezzi").update({
      stato: nuovoStato, cliente_id: null, cantiere_id: null, updated_at: new Date().toISOString()
    }).eq("id", pezzoId);
    if(e1){ alert("Errore: "+e1.message); return; }
    const { error: e2 } = await sb.from("service_order_righe").insert({ service_order_id: id, pezzo_id: pezzoId, azione:"reso" });
    if(e2){ alert("Errore: "+e2.message); return; }
    render();
  };
}

            <td><input type="number" step="0.01" class="lp-mese" value="${l.prezzo_noleggio_mensile??""}" style="width:90px;"></td>
            <td><input type="number" step="0.01" class="lp-iva" value="${l.iva_percentuale??22}" style="width:70px;"></td>
            <td><button class="secondary btn-salva-prezzo" data-id="${a.id}">Salva</button></td>
          </tr>`;
        }).join("")}
      </tbody></table>`}

function wireListino(){
  document.querySelectorAll(".btn-salva-prezzo").forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest("tr");
      const payload = {
        articolo_id: btn.dataset.id,
        prezzo_vendita: parseFloat(tr.querySelector(".lp-vendita").value) || null,
        prezzo_noleggio_giornaliero: parseFloat(tr.querySelector(".lp-giorno").value) || null,
        prezzo_noleggio_settimanale: parseFloat(tr.querySelector(".lp-settimana").value) || null,
        prezzo_noleggio_mensile: parseFloat(tr.querySelector(".lp-mese").value) || null,
        iva_percentuale: parseFloat(tr.querySelector(".lp-iva").value) || 0,
        updated_at: new Date().toISOString(),
      };
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Salvataggio...";
      const { data, error } = await sb.from("listino_prezzi").upsert(payload, { onConflict: "articolo_id" }).select();
      if(error){
        alert("Errore nel salvataggio: "+error.message+"\n\n(Codice: "+(error.code||"n/d")+")");
        btn.disabled = false;
        btn.textContent = originalLabel;
        return;
      }
      if(data && data[0]){
        const idx = state.data.listino.findIndex(l=>l.articolo_id===payload.articolo_id);
        if(idx>=0) state.data.listino[idx] = data[0]; else state.data.listino.push(data[0]);
      }
      btn.textContent = "✓ Salvato";
      setTimeout(()=>{ btn.disabled=false; btn.textContent = originalLabel; }, 1500);
    };
  });
}

function wirePreventivi(){
  if(state.preventivoAperto){ wirePreventivoDettaglio(state.preventivoAperto); return; }
  const selCliente = document.getElementById("pv-cliente");
  const selCantiere = document.getElementById("pv-cantiere");
  function aggiornaCantieri(){
    if(!selCliente) return;
    const opts = state.data.cantieri.filter(k=>k.cliente_id===selCliente.value)
      .map(k=>`<option value="${k.id}">${escapeHtml(k.nome)}</option>`).join("");
    selCantiere.innerHTML = `<option value="">-- nessuno --</option>` + opts;
  }
  if(selCliente){ aggiornaCantieri(); selCliente.onchange = aggiornaCantieri; }
  const f = document.getElementById("form-preventivo");
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      cliente_id: selCliente.value,
      cantiere_id: selCantiere.value || null,
      sconto_percentuale: parseFloat(document.getElementById("pv-sconto").value) || 0,
      note: document.getElementById("pv-note").value.trim() || null,
      stato: "bozza",
      created_by: state.session.user.id,
    };
    const { error } = await sb.from("preventivi").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-apri-pv").forEach(b=>{
    b.onclick = ()=>{ state.preventivoAperto = b.dataset.id; render(); };
  });
}

function wirePreventivoDettaglio(id){
  document.getElementById("btn-torna-pv").onclick = ()=>{ state.preventivoAperto=null; render(); };
  document.getElementById("btn-stampa-pv").onclick = ()=>{ stampaPreventivo(id); };
  const btnEliminaPv = document.getElementById("btn-elimina-pv");
  if(btnEliminaPv){
    const pv = state.data.preventivi.find(p=>p.id===id);
    btnEliminaPv.onclick = ()=>confirmDelete("preventivi", id, `il preventivo #${pv? pv.numero : ""}`, ()=>{ state.preventivoAperto=null; });
  }
  document.querySelectorAll(".btn-stato-pv").forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from("preventivi").update({ stato: b.dataset.stato }).eq("id", id);
      if(error){ alert("Errore: "+error.message); return; }
      render();
    };
  });
  const btnCreaSO = document.getElementById("btn-crea-so-da-pv");
  if(btnCreaSO) btnCreaSO.onclick = async ()=>{
    const pv = state.data.preventivi.find(p=>p.id===id);
    const { error } = await sb.from("service_orders").insert({
      cliente_id: pv.cliente_id, cantiere_id: pv.cantiere_id, preventivo_id: pv.id,
      stato: "aperto", created_by: state.session.user.id,
    });
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const rpArticolo = document.getElementById("rp-articolo");
  const rpTipo = document.getElementById("rp-tipo");
  const rpPrezzo = document.getElementById("rp-prezzo");
  function autoPrezzo(){
    if(!rpArticolo) return;
    const l = prezzoArticolo(rpArticolo.value);
    if(!l) return;
    const map = { vendita:"prezzo_vendita", noleggio_giornaliero:"prezzo_noleggio_giornaliero", noleggio_settimanale:"prezzo_noleggio_settimanale", noleggio_mensile:"prezzo_noleggio_mensile" };
    const v = l[map[rpTipo.value]];
    if(v!=null) rpPrezzo.value = v;
  }
  if(rpArticolo){ autoPrezzo(); rpArticolo.onchange = autoPrezzo; rpTipo.onchange = autoPrezzo; }
  const fRiga = document.getElementById("form-riga-pv");
  if(fRiga) fRiga.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      preventivo_id: id,
      articolo_id: rpArticolo.value,
      tipo_prezzo: rpTipo.value,
      quantita: parseFloat(document.getElementById("rp-quantita").value) || 1,
      prezzo_unitario: parseFloat(rpPrezzo.value) || 0,
      sconto_percentuale: parseFloat(document.getElementById("rp-sconto").value) || 0,
    };
    const { error } = await sb.from("preventivo_righe").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-rimuovi-riga").forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from("preventivo_righe").delete().eq("id", b.dataset.id);
      if(error){ alert("Errore: "+error.message); return; }
      render();
    };
  });
}

    <form id="form-edit-fattura">
      <div class="form-grid">
        <div><label>Cliente/Fornitore</label>
          ${f.tipo==="emessa"? `<select id="ef-cliente">${clientiOpts}</select>` : `<select id="ef-fornitore">${fornitoriOpts}</select>`}
        </div>
        <div><label>Data emissione</label><input type="date" id="ef-emissione" value="${f.data_emissione||""}"></div>
        <div><label>Data scadenza</label><input type="date" id="ef-scadenza" value="${f.data_scadenza||""}"></div>
        <div><label>Imponibile (€) *</label><input type="number" step="0.01" required id="ef-imponibile" value="${f.importo_imponibile}"></div>
        <div><label>IVA %</label><input type="number" step="0.01" id="ef-iva" value="${f.iva_percentuale}"></div>
      </div>
      <label>Note</label><textarea id="ef-note">${escapeHtml(f.note||"")}</textarea>
      <div class="actions" style="margin-top:14px;">
        <button type="submit">Salva modifiche</button>
        <button type="button" class="secondary" id="btn-annulla-edit">Annulla</button>
        ${myRole()==="admin"? `<button type="button" class="danger" id="btn-elimina-edit">Elimina fattura</button>` : ""}
      </div>
    </form>
  `;
  openModal(`Modifica fattura #${f.numero}`, body, (bodyEl)=>{
    bodyEl.querySelector("#btn-annulla-edit").onclick = closeModal;
    const btnDel = bodyEl.querySelector("#btn-elimina-edit");
    if(btnDel) btnDel.onclick = ()=>confirmDelete("fatture", id, `la fattura #${f.numero}`);
    bodyEl.querySelector("#form-edit-fattura").onsubmit = async (e)=>{
      e.preventDefault();
      const payload = {
        data_emissione: bodyEl.querySelector("#ef-emissione").value || f.data_emissione,
        data_scadenza: bodyEl.querySelector("#ef-scadenza").value || null,
        importo_imponibile: parseFloat(bodyEl.querySelector("#ef-imponibile").value) || 0,
        iva_percentuale: parseFloat(bodyEl.querySelector("#ef-iva").value) || 0,
        note: bodyEl.querySelector("#ef-note").value.trim() || null,
      };
      if(f.tipo==="emessa") payload.cliente_id = bodyEl.querySelector("#ef-cliente").value;
      else payload.fornitore_id = bodyEl.querySelector("#ef-fornitore").value;
      const { error } = await sb.from("fatture").update(payload).eq("id", id);
      if(error){ alert("Errore: "+error.message); return; }
      closeModal();
      render();
    };
  });
}
function wireFatture(){
  const selTipo = document.getElementById("ft-tipo");
  const wrapCliente = document.getElementById("ft-cliente-wrap");
  const wrapFornitore = document.getElementById("ft-fornitore-wrap");
  function aggiornaTipo(){
    const isEmessa = selTipo.value === "emessa";
    wrapCliente.style.display = isEmessa? "" : "none";
    wrapFornitore.style.display = isEmessa? "none" : "";
  }
  if(selTipo){ aggiornaTipo(); selTipo.onchange = aggiornaTipo; }
  const f = document.getElementById("form-fattura");
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    const isEmessa = selTipo.value === "emessa";
    const payload = {
      tipo: selTipo.value,
      cliente_id: isEmessa? document.getElementById("ft-cliente").value : null,
      fornitore_id: !isEmessa? document.getElementById("ft-fornitore").value : null,
      service_order_id: document.getElementById("ft-so").value || null,
      data_emissione: document.getElementById("ft-emissione").value || new Date().toISOString().slice(0,10),
      data_scadenza: document.getElementById("ft-scadenza").value || null,
      importo_imponibile: parseFloat(document.getElementById("ft-imponibile").value) || 0,
      iva_percentuale: parseFloat(document.getElementById("ft-iva").value) || 0,
      note: document.getElementById("ft-note").value.trim() || null,
      stato: "non_pagata",
      created_by: state.session.user.id,
    };
    const { error } = await sb.from("fatture").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-segna-pagata").forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from("fatture").update({ stato:"pagata" }).eq("id", b.dataset.id);
      if(error){ alert("Errore: "+error.message); return; }
      render();
    };
  });
  document.querySelectorAll(".btn-segna-insoluto").forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from("fatture").update({ stato:"insoluto" }).eq("id", b.dataset.id);
      if(error){ alert("Errore: "+error.message); return; }
      render();
    };
  });
  document.querySelectorAll(".btn-edit-fattura").forEach(b=>{ b.onclick = ()=>editFattura(b.dataset.id); });
}

// ============================================================
// CASSA / BANCA
// ============================================================
function viewCassa(){
  const rows = state.data.movimenti;
  const entrate = rows.filter(m=>m.tipo==="entrata").reduce((s,m)=>s+Number(m.importo),0);
  const uscite = rows.filter(m=>m.tipo==="uscita").reduce((s,m)=>s+Number(m.importo),0);
  const saldo = entrate - uscite;
  return `
    <div class="kpi-grid" style="margin-bottom:18px;">
      <div class="kpi"><div class="num">${fmtMoney(entrate)}</div><div class="lbl">Totale entrate</div></div>
      <div class="kpi"><div class="num">${fmtMoney(uscite)}</div><div class="lbl">Totale uscite</div></div>
      <div class="kpi"><div class="num">${fmtMoney(saldo)}</div><div class="lbl">Saldo</div></div>
    </div>
    <div class="card">
      <h2>Nuovo movimento</h2>
      <form id="form-movimento">
        <div class="form-grid">
          <div><label>Tipo *</label><select required id="mv-tipo"><option value="entrata">Entrata</option><option value="uscita">Uscita</option></select></div>
          <div><label>Metodo</label><select id="mv-metodo"><option value="banca">Banca</option><option value="cassa">Cassa</option></select></div>
          <div><label>Importo (€) *</label><input type="number" step="0.01" required id="mv-importo"></div>
          <div><label>Data</label><input type="date" id="mv-data" value="${new Date().toISOString().slice(0,10)}"></div>
        </div>
        <label>Descrizione</label><textarea id="mv-descrizione"></textarea>
        <div style="margin-top:10px;"><button type="submit">Registra movimento</button></div>
      </form>
    </div>
    <div class="card">
      <h2>Movimenti (${rows.length})</h2>
      ${rows.length===0? `<div class="empty">Nessun movimento registrato.</div>` : `
      <table><thead><tr><th>Data</th><th>Tipo</th><th>Metodo</th><th>Importo</th><th>Descrizione</th><th></th></tr></thead>
      <tbody>
        ${rows.map(m=>`
          <tr>
            <td>${fmtDateOnly(m.data)}</td>
            <td><span class="badge ${m.tipo==='entrata'?'disponibile':'danneggiato'}">${m.tipo==='entrata'?'Entrata':'Uscita'}</span></td>
            <td>${m.metodo==='banca'?'Banca':'Cassa'}</td>
            <td>${fmtMoney(m.importo)}</td>
            <td>${escapeHtml(m.descrizione||"-")}</td>
            <td><button class="secondary btn-edit-movimento" data-id="${m.id}">Modifica</button></td>
          </tr>
        `).join("")}
      </tbody></table>`}
    </div>
  `;
}
function wireCassa(){
  const f = document.getElementById("form-movimento");
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      tipo: document.getElementById("mv-tipo").value,
      metodo: document.getElementById("mv-metodo").value,
      importo: parseFloat(document.getElementById("mv-importo").value) || 0,
      data: document.getElementById("mv-data").value || new Date().toISOString().slice(0,10),
      descrizione: document.getElementById("mv-descrizione").value.trim() || null,
      created_by: state.session.user.id,
    };
    const { error } = await sb.from("movimenti_cassa").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-edit-movimento").forEach(b=>{ b.onclick = ()=>editMovimento(b.dataset.id); });
}
function editMovimento(id){
  const m = state.data.movimenti.find(x=>x.id===id);
  if(!m) return;
  const body = `
    <form id="form-edit-movimento">
      <div class="form-grid">
        <div><label>Tipo *</label><select required id="em-tipo"><option value="entrata" ${m.tipo==="entrata"?"selected":""}>Entrata</option><option value="uscita" ${m.tipo==="uscita"?"selected":""}>Uscita</option></select></div>
        <div><label>Metodo</label><select id="em-metodo"><option value="banca" ${m.metodo==="banca"?"selected":""}>Banca</option><option value="cassa" ${m.metodo==="cassa"?"selected":""}>Cassa</option></select></div>
        <div><label>Importo (€) *</label><input type="number" step="0.01" required id="em-importo" value="${m.importo}"></div>
        <div><label>Data</label><input type="date" id="em-data" value="${m.data||""}"></div>
      </div>
      <label>Descrizione</label><textarea id="em-descrizione">${escapeHtml(m.descrizione||"")}</textarea>
      <div class="actions" style="margin-top:14px;">
        <button type="submit">Salva modifiche</button>
        <button type="button" class="secondary" id="btn-annulla-edit">Annulla</button>
        ${myRole()==="admin"? `<button type="button" class="danger" id="btn-elimina-edit">Elimina movimento</button>` : ""}
      </div>
    </form>
  `;
  openModal("Modifica movimento", body, (bodyEl)=>{
    bodyEl.querySelector("#btn-annulla-edit").onclick = closeModal;
    const btnDel = bodyEl.querySelector("#btn-elimina-edit");
    if(btnDel) btnDel.onclick = ()=>confirmDelete("movimenti_cassa", id, "questo movimento");
    bodyEl.querySelector("#form-edit-movimento").onsubmit = async (e)=>{
      e.preventDefault();
      const payload = {
        tipo: bodyEl.querySelector("#em-tipo").value,
        metodo: bodyEl.querySelector("#em-metodo").value,
        importo: parseFloat(bodyEl.querySelector("#em-importo").value) || 0,
        data: bodyEl.querySelector("#em-data").value || m.data,
        descrizione: bodyEl.querySelector("#em-descrizione").value.trim() || null,
      };
      const { error } = await sb.from("movimenti_cassa").update(payload).eq("id", id);
      if(error){ alert("Errore: "+error.message); return; }
      closeModal();
      render();
    };
  });
}

// ============================================================
// UTENTI E RUOLI (solo admin)
// ============================================================
function viewUtenti(){
  const rows = state.data.profiles;
  return `
    <div class="card">
      <h2>Utenti e ruoli</h2>
      <p><small class="hint">Assegna a ciascun utente il ruolo corretto. Magazzino: gestisce quantità e pezzi. Commerciale: gestisce clienti/cantieri. Contabile: vede clienti/cantieri (non il magazzino). Socio/Azionista: sola lettura dell'andamento aziendale. Admin: accesso completo.</small></p>
      <table><thead><tr><th>Utente</th><th>Ruolo attuale</th><th>Cambia ruolo</th></tr></thead>
      <tbody>
        ${rows.map(p=>`
          <tr>
            <td>${escapeHtml(p.full_name||"-")}</td>
            <td>${badge(p.ruolo==="admin"?"chiuso":p.ruolo==="magazzino"?"disponibile":p.ruolo==="commerciale"?"in_uso":p.ruolo==="shareholder"?"aperto":"in_revisione")} ${escapeHtml(ruoloLabel(p.ruolo))}</td>
            <td>
              <select data-id="${p.id}" class="sel-ruolo">
                <option value="admin" ${p.ruolo==="admin"?"selected":""}>Amministratore</option>
                <option value="magazzino" ${p.ruolo==="magazzino"?"selected":""}>Magazzino</option>
                <option value="commerciale" ${p.ruolo==="commerciale"?"selected":""}>Commerciale</option>
                <option value="contabile" ${p.ruolo==="contabile"?"selected":""}>Contabile</option>
                <option value="shareholder" ${p.ruolo==="shareholder"?"selected":""}>Socio/Azionista</option>
              </select>
            </td>
          </tr>
        `).join("")}
      </tbody></table>
    </div>
  `;
}
function wireUtenti(){
  document.querySelectorAll(".sel-ruolo").forEach(sel=>{
    sel.onchange = async ()=>{
      const { error } = await sb.from("profiles").update({ ruolo: sel.value }).eq("id", sel.dataset.id);
      if(error){ alert("Errore: "+error.message); render(); return; }
      render();
    };
  });
}
