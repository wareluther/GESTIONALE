<style>
  :root{
    --primary:#2f6fe0; --primary-dark:#1f52ad; --primary-light:#eaf1fd;
    --accent:#eb6834; --aqua:#1baf7a;
    --bg:#eef1f6; --card:#ffffff; --border:#e2e6ee; --border-soft:#edf0f5;
    --text:#1b2333; --muted:#6b7688; --muted-soft:#98a2b3;
    --danger:#d9483d; --danger-bg:#fdeceb;
    --ok:#1f9d5e; --ok-bg:#e5f8ee;
    --warn:#c9860f; --warn-bg:#fdf2dc;
    --radius-sm:8px; --radius:12px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(23,32,58,.06);
    --shadow-md:0 8px 24px -8px rgba(23,32,58,.2);
    --shadow-header:0 2px 10px rgba(20,40,90,.15);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-header);position:relative;z-index:2;}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;}
  header .user-box{font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  header .user-box span{opacity:.95;}
  .lang-switch{display:flex;background:rgba(255,255,255,.16);border-radius:8px;padding:2px;}
  .lang-switch button{background:transparent;color:#fff;padding:5px 10px;font-size:11px;font-weight:700;border-radius:6px;opacity:.8;box-shadow:none;}
  .lang-switch button.active{background:#fff;color:var(--primary-dark);opacity:1;}
  .lang-switch button:hover{background:rgba(255,255,255,.3);}
  .lang-switch button.active:hover{background:#fff;}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;background:var(--primary);color:#fff;transition:background .15s ease,transform .05s ease;box-shadow:var(--shadow-sm);}
  button:hover{background:var(--primary-dark);}
  button:active{transform:translateY(1px);}
  button.secondary{background:#eef1f7;color:var(--text);box-shadow:none;}
  button.secondary:hover{background:#e2e7f0;}
  button.danger{background:var(--danger);}
  button.danger:hover{background:#c13a30;}
  nav{background:#fff;border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 20px;overflow-x:auto;}
  nav button{background:transparent;color:var(--muted);border-radius:0;padding:13px 16px;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:none;border-bottom:2px solid transparent;}
  nav button.active{color:var(--primary);border-bottom:2px solid var(--primary);}
  nav button:hover{background:var(--primary-light);color:var(--primary);}
  main{flex:1;padding:24px;max-width:1240px;width:100%;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
  .card h2{margin-top:0;font-size:16px;font-weight:700;letter-spacing:-.01em;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-soft);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#fafbfd;}
  tr:hover td{background:#f8fafc;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);transition:border-color .15s ease,box-shadow .15s ease;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  textarea{min-height:64px;font-family:inherit;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.01em;}
  .badge.disponibile{background:var(--ok-bg);color:var(--ok);}
  .badge.in_uso{background:var(--primary-light);color:var(--primary);}
  .badge.in_revisione,.badge.da_riparare{background:var(--warn-bg);color:var(--warn);}
  .badge.danneggiato,.badge.fuori_servizio{background:var(--danger-bg);color:var(--danger);}
  .badge.aperto{background:var(--primary-light);color:var(--primary);}
  .badge.in_corso{background:var(--warn-bg);color:var(--warn);}
  .badge.chiuso{background:var(--ok-bg);color:var(--ok);}
  .badge.annullato{background:var(--danger-bg);color:var(--danger);}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#eef2fb 0%,var(--bg) 55%);}
  .login-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow-md);}
  .login-box h1{font-size:21px;text-align:center;margin-bottom:4px;font-weight:800;color:var(--primary-dark);}
  .login-box p.sub{text-align:center;color:var(--muted);font-size:13px;margin-top:0;margin-bottom:22px;}
  .login-box label{margin-top:12px;}
  .login-box button{width:100%;margin-top:20px;padding:11px;}
  .login-box .lang-switch{justify-content:center;background:#eef1f7;}
  .login-box .lang-switch button{color:var(--muted);}
  .login-box .lang-switch button.active{background:var(--primary);color:#fff;}
  .switch-link{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .switch-link a{color:var(--primary);cursor:pointer;text-decoration:none;font-weight:600;}
  .msg{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .msg.error{background:var(--danger-bg);color:var(--danger);}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .empty{color:var(--muted-soft);font-size:13px;padding:24px;text-align:center;}
  .pill-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .pill-select button{background:#eef1f7;color:var(--text);padding:7px 14px;font-size:12.5px;box-shadow:none;font-weight:600;}
  .pill-select button.active{background:var(--primary);color:#fff;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);border-top:3px solid var(--primary);}
  .kpi .num{font-size:27px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500;}
  select[multiple]{height:auto;}
  .close-x{background:transparent;color:var(--muted);padding:4px 8px;box-shadow:none;}
  .close-x:hover{background:#eef1f7;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,26,45,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:#fff;border-radius:var(--radius-lg);padding:22px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow-md);}
  .modal h3{margin-top:0;font-weight:700;}
  small.hint{color:var(--muted);}
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:18px;}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap canvas{max-width:100%;}
  @media (max-width:640px){
    header{padding:12px 16px;} main{padding:16px;} .card{padding:16px;}
  }
</style>

<script>
// ============================================================
// CONFIGURAZIONE SUPABASE
// ============================================================
const SUPABASE_URL = "https://pvlzvubxwbwtsqgmxdvt.supabase.co";
const SUPABASE_KEY = "sb_publishable_BE-eqQHoW5Vaxy3HURnt6w_wU2sN6dW";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// STATO GLOBALE
// ============================================================
let state = {
  session: null,
  view: "dashboard",
  data: { clienti: [], cantieri: [], articoli: [], pezzi: [], serviceOrders: [], righe: [], profiles: [], listino: [], preventivi: [], preventivoRighe: [], fornitori: [], fatture: [], movimenti: [], documenti: [], attivitaCrm: [], commentiSO: [], messaggiInterni: [], notificheEventi: [], notificheLette: [], ddt: [], ddtRighe: [], logModifiche: [] },
  authMode: "login", // login | signup
  soAperto: null, // id service order aperto nel dettaglio
  preventivoAperto: null, // id preventivo aperto nel dettaglio
  ddtAperto: null, // id ddt aperto nel dettaglio
  andamentoPeriodo: "rolling12", // rolling12 | annocorrente | annoscorso | confronto
  filtroLogModifiche: "tutte",
  lang: (function(){ try{ return localStorage.getItem("gestionale_lang") || "it"; }catch(e){ return "it"; } })(),
};

const app = document.getElementById("app");

// ============================================================
// TRADUZIONE (italiano/francese) — t(testoIt, testoFr) restituisce il
// testo nella lingua attualmente selezionata (state.lang). La lingua si
// sceglie con il pulsante IT/FR in alto e resta salvata sul dispositivo.
// ============================================================
function tr(it, fr){ return state.lang === "fr" ? fr : it; }
function cambiaLingua(nuovaLingua){
  state.lang = nuovaLingua;
  try{ localStorage.setItem("gestionale_lang", nuovaLingua); }catch(e){}
  render();
}

function statoLabel(s){
  const map = tr({
    disponibile:"Disponibile", in_uso:"In uso", in_revisione:"In revisione",
    da_riparare:"Da riparare", danneggiato:"Danneggiato", fuori_servizio:"Fuori servizio",
    attivo:"Attivo", sospeso:"Sospeso", concluso:"Concluso",
    aperto:"Aperto", in_corso:"In corso", chiuso:"Chiuso", annullato:"Annullato"
  }, {
    disponibile:"Disponible", in_uso:"En cours d'utilisation", in_revisione:"En révision",
    da_riparare:"À réparer", danneggiato:"Endommagé", fuori_servizio:"Hors service",
    attivo:"Actif", sospeso:"Suspendu", concluso:"Terminé",
    aperto:"Ouvert", in_corso:"En cours", chiuso:"Clôturé", annullato:"Annulé"
  });
  return map[s] || s;
}
function badge(s){ return `<span class="badge ${s}">${statoLabel(s)}</span>`; }
function fmtDate(d){ if(!d) return "-"; const dt=new Date(d); return dt.toLocaleDateString("it-IT")+" "+dt.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
function escapeHtml(str){ if(str==null) return ""; return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function soNumero(n){ return n==null? "------" : String(n).padStart(6,"0"); }
function ddtNumero(n){ return n==null? "------" : String(n).padStart(6,"0"); }

// ============================================================
// ESPORTAZIONI (CSV / Excel / PDF)
// ============================================================
function scaricaBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(filename, headers, rows){
  const esc = v=>{ const s = v==null? "" : String(v); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(esc).join(";"), ...rows.map(r=>r.map(esc).join(";"))];
  scaricaBlob(new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8;"}), filename+".csv");
}
function exportExcel(filename, headers, rows, sheetName){
  if(typeof XLSX==="undefined"){ alert("La libreria per l'export Excel non si è ancora caricata: riprova tra qualche secondo."); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (sheetName||"Foglio1").slice(0,31));
  XLSX.writeFile(wb, filename+".xlsx");
}
function exportPDF(filename, title, headers, rows){
  if(typeof window.jspdf==="undefined"){ alert("La libreria per l'export PDF non si è ancora caricata: riprova tra qualche secondo."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: headers.length>5? "landscape" : "portrait" });
  doc.setFontSize(14); doc.text(title, 14, 16);
  doc.autoTable({ head:[headers], body: rows, startY: 22, styles:{ fontSize:8 } });
  doc.save(filename+".pdf");
}
function exportButtonsHtml(idPrefix){
  return `<div class="actions" style="margin-bottom:10px;">
    <button type="button" class="secondary" id="${idPrefix}-csv">⬇️ CSV</button>
    <button type="button" class="secondary" id="${idPrefix}-xlsx">⬇️ Excel</button>
    <button type="button" class="secondary" id="${idPrefix}-pdf">⬇️ PDF</button>
  </div>`;
}
function wireExportButtons(idPrefix, filename, title, headers, getRows){
  const bC = document.getElementById(idPrefix+"-csv");
  const bX = document.getElementById(idPrefix+"-xlsx");
  const bP = document.getElementById(idPrefix+"-pdf");
  if(bC) bC.onclick = ()=>exportCSV(filename, headers, getRows());
  if(bX) bX.onclick = ()=>exportExcel(filename, headers, getRows(), title);
  if(bP) bP.onclick = ()=>exportPDF(filename, title, headers, getRows());
}

// ============================================================
// SCANSIONE QR / CODICI A BARRE DA FOTOCAMERA
// ============================================================
let _scannerStream = null;
function fermaScanner(){
  if(_scannerStream){ _scannerStream.getTracks().forEach(t=>t.stop()); _scannerStream = null; }
}
function apriScannerQR(onRisultato){
  const body = `
    <video id="scanner-video" style="width:100%;border-radius:8px;background:#000;" playsinline muted autoplay></video>
    <canvas id="scanner-canvas" style="display:none;"></canvas>
    <p><small class="hint">Inquadra il codice QR o a barre stampato sul pezzo. Serve il permesso di usare la fotocamera.</small></p>
    <div id="scanner-msg"></div>
  `;
  openModal("Scansiona codice", body, async (bodyEl)=>{
    const video = bodyEl.querySelector("#scanner-video");
    const canvas = bodyEl.querySelector("#scanner-canvas");
    const ctx = canvas.getContext("2d");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      bodyEl.querySelector("#scanner-msg").innerHTML = `<div class="msg error">Questo browser/dispositivo non supporta l'accesso alla fotocamera.</div>`;
      return;
    }
    try{
      _scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch(err){
      bodyEl.querySelector("#scanner-msg").innerHTML = `<div class="msg error">Impossibile accedere alla fotocamera: ${escapeHtml(err.message)}</div>`;
      return;
    }
    video.srcObject = _scannerStream;
    let attivo = true;
    function ferma(){ attivo = false; fermaScanner(); }
    function tick(){
      if(!attivo) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA && typeof jsQR!=="undefined" && canvas.parentNode){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        if(canvas.width>0 && canvas.height>0){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(img.data, img.width, img.height);
          if(code && code.data){
            ferma();
            closeModal();
            onRisultato(code.data.trim());
            return;
          }
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

// ============================================================
// RICERCA GLOBALE
// ============================================================
function eseguiRicercaGlobale(query){
  const q = (query||"").trim().toLowerCase();
  if(q.length<2) return [];
  const risultati = [];
  state.data.clienti.forEach(c=>{
    if([c.ragione_sociale,c.referente,c.email,c.telefono,c.piva].some(v=>v && String(v).toLowerCase().includes(q))){
      risultati.push({ tipo:"Cliente", label: c.ragione_sociale, vai: ()=>{ state.view="clienti"; } });
    }
  });
  state.data.cantieri.forEach(k=>{
    if([k.nome,k.indirizzo,k.referente].some(v=>v && String(v).toLowerCase().includes(q))){
      risultati.push({ tipo:"Cantiere", label: k.nome+" — "+clienteNome(k.cliente_id), vai: ()=>{ state.view="cantieri"; } });
    }
  });
  state.data.pezzi.forEach(p=>{
    if(p.dtr && p.dtr.toLowerCase().includes(q)){
      risultati.push({ tipo:"Pezzo (DTR)", label: p.dtr+" — "+articoloLabel(p.articolo_id), vai: ()=>{ state.view="pezzi"; } });
    }
  });
  state.data.articoli.forEach(a=>{
    if([a.codice,a.descrizione].some(v=>v && String(v).toLowerCase().includes(q))){
      risultati.push({ tipo:"Articolo", label: a.codice+" — "+a.descrizione, vai: ()=>{ state.view="magazzino"; } });
    }
  });
  state.data.serviceOrders.forEach(s=>{
    if(soNumero(s.numero).includes(q.replace(/\D/g,"")) && q.replace(/\D/g,"").length>0){
      risultati.push({ tipo:"Service Order", label:"#"+soNumero(s.numero)+" — "+clienteNome(s.cliente_id), vai: ()=>{ state.view="serviceorder"; state.soAperto=s.id; } });
    }
  });
  if(state.data.ddt) state.data.ddt.forEach(dd=>{
    if(ddtNumero(dd.numero).includes(q.replace(/\D/g,"")) && q.replace(/\D/g,"").length>0){
      risultati.push({ tipo:"DDT", label:"#"+ddtNumero(dd.numero)+" — "+clienteNome(dd.cliente_id), vai: ()=>{ state.view="ddt"; state.ddtAperto=dd.id; } });
    }
  });
  return risultati.slice(0,30);
}
function apriRicercaGlobale(){
  const body = `
    <input type="text" id="ricerca-globale-input" placeholder="Cerca cliente, cantiere, DTR, articolo, Service Order, DDT..." autofocus>
    <div id="ricerca-globale-risultati" style="margin-top:14px;"></div>
  `;
  openModal("Ricerca", body, (bodyEl)=>{
    const input = bodyEl.querySelector("#ricerca-globale-input");
    const risEl = bodyEl.querySelector("#ricerca-globale-risultati");
    function aggiorna(){
      const ris = eseguiRicercaGlobale(input.value);
      if(input.value.trim().length<2){ risEl.innerHTML = `<div class="empty">Scrivi almeno 2 caratteri.</div>`; return; }
      risEl.innerHTML = ris.length===0? `<div class="empty">Nessun risultato.</div>` : `
        <table><tbody>
        ${ris.map((r,i)=>`<tr><td><span class="badge in_uso">${escapeHtml(r.tipo)}</span></td><td>${escapeHtml(r.label)}</td><td><button class="secondary btn-vai-risultato" data-i="${i}">Apri</button></td></tr>`).join("")}
        </tbody></table>`;
      risEl.querySelectorAll(".btn-vai-risultato").forEach(b=>{
        b.onclick = ()=>{ ris[Number(b.dataset.i)].vai(); closeModal(); render(); };
      });
    }
    input.oninput = aggiorna;
    aggiorna();
  });
}

// ============================================================
// MODALE GENERICO (usato per Modifica e per i Documenti)
// ============================================================
function openModal(title, bodyHtml, onMount){
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.id = "modal-bg";
  bg.innerHTML = `<div class="modal"><button type="button" class="close-x" id="modal-close" style="float:right;">✕</button><h3>${escapeHtml(title)}</h3><div id="modal-body">${bodyHtml}</div></div>`;
  document.body.appendChild(bg);
  document.getElementById("modal-close").onclick = closeModal;
  bg.onclick = (e)=>{ if(e.target===bg) closeModal(); };
  if(onMount) onMount(document.getElementById("modal-body"));
}
function closeModal(){
  fermaScanner();
  const bg = document.getElementById("modal-bg");
  if(bg) bg.remove();
}
async function confirmDelete(table, id, labelCosa, afterOk){
  if(!confirm(`Eliminare definitivamente ${labelCosa||"questo elemento"}?\nL'operazione non è reversibile.`)) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if(error){ alert("Errore durante l'eliminazione: "+error.message+"\n\n(Solo l'amministratore può eliminare. Se l'errore persiste contatta l'admin.)"); return; }
  closeModal();
  if(afterOk) afterOk();
  render();
}

// ============================================================
// NOTIFICHE (eventi generati automaticamente sul cambio di stato)
// ============================================================
function apriNotifiche(){
  const eventi = state.data.notificheEventi;
  const lette = new Set(state.data.notificheLette.map(l=>l.evento_id));
  const body = `
    <table><thead><tr><th>Evento</th><th>Quando</th><th></th></tr></thead>
    <tbody>
      ${eventi.length===0? `<tr><td colspan="3" class="empty">Nessuna notifica.</td></tr>` : eventi.map(ev=>`
        <tr style="${lette.has(ev.id)?'':'font-weight:600;'}">
          <td>${escapeHtml(ev.messaggio)}</td>
          <td>${fmtDate(ev.created_at)}</td>
          <td>${!lette.has(ev.id)? `<button class="secondary btn-segna-letta" data-id="${ev.id}">Segna come letta</button>` : "✓"}</td>
        </tr>
      `).join("")}
    </tbody></table>
    <div class="actions" style="margin-top:14px;">
      ${eventi.some(ev=>!lette.has(ev.id))? `<button id="btn-segna-tutte-lette">Segna tutte come lette</button>` : ""}
      ${myRole()==="admin" && eventi.length>0? `<button class="secondary" id="btn-pulisci-notifiche">🧹 Elimina notifiche più vecchie di 90 giorni</button>` : ""}
    </div>
  `;
  openModal("Notifiche", body, (bodyEl)=>{
    bodyEl.querySelectorAll(".btn-segna-letta").forEach(b=>{
      b.onclick = async ()=>{
        await sb.from("notifiche_lette").insert({ utente_id: state.session.user.id, evento_id: b.dataset.id });
        await loadAll();
        apriNotifiche();
      };
    });
    const btnTutte = bodyEl.querySelector("#btn-segna-tutte-lette");
    if(btnTutte) btnTutte.onclick = async ()=>{
      const daSegnare = eventi.filter(ev=>!lette.has(ev.id)).map(ev=>({ utente_id: state.session.user.id, evento_id: ev.id }));
      if(daSegnare.length>0) await sb.from("notifiche_lette").insert(daSegnare);
      closeModal();
      render();
    };
    const btnPulisci = bodyEl.querySelector("#btn-pulisci-notifiche");
    if(btnPulisci) btnPulisci.onclick = async ()=>{
      if(!confirm("Eliminare definitivamente le notifiche più vecchie di 90 giorni? L'operazione non è reversibile.")) return;
      const cutoff = new Date(Date.now() - 90*24*60*60*1000).toISOString();
      const { error } = await sb.from("notifiche_eventi").delete().lt("created_at", cutoff);
      if(error){ alert("Errore: "+error.message); return; }
      await loadAll();
      apriNotifiche();
    };
  });
}

async function initAuth(){

async function handleLogin(email, password){

  return error;
}
async function handleSignup(email, password, fullName){
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name: fullName } } });

}
async function handleLogout(){

}

function clienteNome(id){ const c = state.data.clienti.find(x=>x.id===id); return c ? c.ragione_sociale : "-"; }
function cantiereNome(id){ const c = state.data.cantieri.find(x=>x.id===id); return c ? c.nome : "-"; }
function articoloLabel(id){ const a = state.data.articoli.find(x=>x.id===id); return a ? `${a.codice} - ${a.descrizione}` : "-"; }
function pezzoLabel(id){ const p = state.data.pezzi.find(x=>x.id===id); return p ? `${p.dtr} (${articoloLabel(p.articolo_id)})` : "-"; }
function myProfile(){ return state.session ? state.data.profiles.find(p=>p.id===state.session.user.id) : null; }
function myRole(){ const p = myProfile(); return p ? p.ruolo : null; }
function ruoloLabel(r){ const map=tr({admin:"Amministratore",magazzino:"Magazzino",commerciale:"Commerciale",contabile:"Contabile",shareholder:"Socio/Azionista"},{admin:"Administrateur",magazzino:"Entrepôt",commerciale:"Commercial",contabile:"Comptable",shareholder:"Actionnaire"}); return map[r]||r; }
function prezzoArticolo(articoloId){ return state.data.listino.find(l=>l.articolo_id===articoloId) || null; }
function fmtMoney(n){ if(n==null || isNaN(n)) return "-"; return Math.round(Number(n)).toLocaleString("fr-FR",{maximumFractionDigits:0})+" FCFA"; }
function tipoPrezzoLabel(tp){ const map=tr({vendita:"Vendita",noleggio_giornaliero:"Noleggio giorno",noleggio_settimanale:"Noleggio settimana",noleggio_mensile:"Noleggio mese"},{vendita:"Vente",noleggio_giornaliero:"Location jour",noleggio_settimanale:"Location semaine",noleggio_mensile:"Location mois"}); return map[tp]||tp; }
function totaleRiga(r){ return r.quantita * r.prezzo_unitario * (1 - (r.sconto_percentuale||0)/100); }
function totalePreventivo(preventivoId){
  const righe = state.data.preventivoRighe.filter(r=>r.preventivo_id===preventivoId);
  const sub = righe.reduce((s,r)=>s+totaleRiga(r),0);
  const prev = state.data.preventivi.find(p=>p.id===preventivoId);
  const scontoGlobale = prev ? (prev.sconto_percentuale||0) : 0;
  return sub * (1 - scontoGlobale/100);
}
function statoPreventivoLabelClass(s){ const map={bozza:"in_revisione",inviato:"in_uso",accettato:"chiuso",rifiutato:"danneggiato"}; return map[s]||s; }
function statoPreventivoLabel(s){ const map=tr({bozza:"Bozza",inviato:"Inviato",accettato:"Accettato",rifiutato:"Rifiutato"},{bozza:"Brouillon",inviato:"Envoyé",accettato:"Accepté",rifiutato:"Refusé"}); return map[s]||s; }
function fornitoreNome(id){ const f = state.data.fornitori.find(x=>x.id===id); return f ? f.ragione_sociale : "-"; }
function isScaduta(f){ return f.stato==="non_pagata" && f.data_scadenza && new Date(f.data_scadenza) < new Date(new Date().toDateString()); }
function statoFatturaEffettivo(f){ return isScaduta(f) ? "scaduta" : f.stato; }
function statoFatturaLabel(s){ const map=tr({non_pagata:"Non pagata",pagata:"Pagata",insoluto:"Insoluto",scaduta:"Scaduta"},{non_pagata:"Non payée",pagata:"Payée",insoluto:"Impayée",scaduta:"Échue"}); return map[s]||s; }
function statoFatturaClass(s){ const map={non_pagata:"in_uso",pagata:"chiuso",insoluto:"danneggiato",scaduta:"da_riparare"}; return map[s]||s; }
function fmtDateOnly(d){ if(!d) return "-"; return new Date(d).toLocaleDateString("it-IT"); }

function renderLogin(){
  const isSignup = state.authMode === "signup";
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="lang-switch" id="lang-switch-login" style="margin-bottom:14px;">
          <button data-lang="it" class="${state.lang==="it"?"active":""}">IT</button>
          <button data-lang="fr" class="${state.lang==="fr"?"active":""}">FR</button>
        </div>
        <h1>${tr("Gestionale Aziendale","Gestion d'entreprise")}</h1>
        <p class="sub">${isSignup? tr("Crea il tuo account","Créez votre compte") : tr("Accedi al tuo account","Connectez-vous à votre compte")}</p>
        <div id="login-msg"></div>
        <form id="login-form">
          ${isSignup? `<label>${tr("Nome completo","Nom complet")}</label><input type="text" id="f-name" required>` : ""}
          <label>Email</label>
          <input type="email" id="f-email" required>
          <label>Password</label>
          <input type="password" id="f-password" required minlength="6">
          <button type="submit">${isSignup? tr("Registrati","S'inscrire") : tr("Accedi","Se connecter")}</button>
        </form>
        <div class="switch-link">
          ${isSignup
            ? `${tr("Hai già un account?","Vous avez déjà un compte ?")} <a id="switch-mode">${tr("Accedi","Se connecter")}</a>`
            : `${tr("Non hai un account?","Vous n'avez pas de compte ?")} <a id="switch-mode">${tr("Registrati","S'inscrire")}</a>`}
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll("#lang-switch-login button").forEach(b=>{ b.onclick = ()=>cambiaLingua(b.dataset.lang); });
  document.getElementById("switch-mode").onclick = ()=>{
    state.authMode = isSignup? "login" : "signup";
    renderLogin();
  };
  document.getElementById("login-form").onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById("f-email").value.trim();
    const password = document.getElementById("f-password").value;
    const msgBox = document.getElementById("login-msg");
    msgBox.innerHTML = "";
    let error;
    if(isSignup){
      const fullName = document.getElementById("f-name").value.trim();
      error = await handleSignup(email, password, fullName);
      if(!error){
        msgBox.innerHTML = `<div class="msg ok">${tr("Registrazione avvenuta. Controlla la tua email se richiesta conferma, poi accedi.","Inscription réussie. Vérifiez votre email si une confirmation est demandée, puis connectez-vous.")}</div>`;
        state.authMode = "login";
        setTimeout(renderLogin, 1800);
        return;
      }
    } else {
      error = await handleLogin(email, password);
    }
    if(error){
      msgBox.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
    }
  };
}

    return tot + v;
  },0);

async function viewAndamento(){
  const now = new Date();
  const annoCorrente = now.getFullYear();
  const annoScorso = annoCorrente - 1;
  const periodo = state.andamentoPeriodo || "rolling12";

  // Clienti/cantieri/pezzi/service order NON sono più leggibili direttamente
  // dallo shareholder (bloccati a livello di database): i totali arrivano
  // da funzioni dedicate che calcolano SOLO numeri aggregati (mai righe grezze),
  // sempre lato server: il browser non riceve più fatture/movimenti di cassa.
  let clientiAttivi = 0, cantieriAttivi = 0, soAperti = 0, valMagazzino = 0;
  const { data: kpi, error: kpiErr } = await sb.rpc("andamento_kpi");
  if(!kpiErr && kpi && kpi[0]){
    clientiAttivi = kpi[0].clienti_attivi || 0;
    cantieriAttivi = kpi[0].cantieri_attivi || 0;
    soAperti = kpi[0].service_order_attivi || 0;
    valMagazzino = Number(kpi[0].valore_magazzino) || 0;
  }

  // Totali economici in base al periodo selezionato (calcolati sul server) -----
  const periodoPerTotali = periodo==="confronto" ? "annocorrente" : periodo;
  let etichettaPeriodo = "Da sempre";
  if(periodo==="annocorrente") etichettaPeriodo = "Anno "+annoCorrente;
  else if(periodo==="annoscorso") etichettaPeriodo = "Anno "+annoScorso;
  else if(periodo==="confronto") etichettaPeriodo = "Anno "+annoCorrente+" (confronto con "+annoScorso+" nei grafici)";

  const { data: totRaw, error: totErr } = await sb.rpc("andamento_totali", { p_periodo: periodoPerTotali });
  const fin = (!totErr && totRaw) ? {
    fatturato: Number(totRaw.fatturato)||0, incassato: Number(totRaw.incassato)||0,
    daIncassare: Number(totRaw.da_incassare)||0, costi: Number(totRaw.costi)||0,
    utile: Number(totRaw.utile)||0, entrate: Number(totRaw.entrate)||0,
    uscite: Number(totRaw.uscite)||0, saldo: Number(totRaw.saldo)||0,
  } : { fatturato:0, incassato:0, daIncassare:0, costi:0, utile:0, entrate:0, uscite:0, saldo:0 };

  // Serie mensili e confronto anni: anche queste arrivano già calcolate dal server -
  let mesiLabels=[], fatturatoMensile=[], saldoMensile=[], fatturatoMensileB=null, saldoMensileB=null, legendaAnnoA=null, legendaAnnoB=null, confrontoBarre=null;

  if(periodo==="confronto"){
    legendaAnnoA = "Anno "+annoScorso; legendaAnnoB = "Anno "+annoCorrente;
    mesiLabels = [...Array(12).keys()].map(m=>new Date(2000,m,1).toLocaleDateString("it-IT",{month:"short"}));
    const { data: righeConfronto } = await sb.rpc("andamento_confronto");
    const ord = (righeConfronto||[]).slice().sort((a,b)=>a.mese_indice-b.mese_indice);
    fatturatoMensile = ord.map(r=>Number(r.fatturato_a)||0);
    saldoMensile = ord.map(r=>Number(r.saldo_a)||0);
    fatturatoMensileB = ord.map(r=> r.fatturato_b===null ? null : Number(r.fatturato_b));
    saldoMensileB = ord.map(r=> r.saldo_b===null ? null : Number(r.saldo_b));

    const { data: confTot } = await sb.rpc("andamento_confronto_totali");
    const righeTot = confTot||[];
    const norm = r=>({
      fatturato: Number(r?.fatturato)||0, incassato: Number(r?.incassato)||0,
      daIncassare: Number(r?.da_incassare)||0, costi: Number(r?.costi)||0, utile: Number(r?.utile)||0,
    });
    confrontoBarre = {
      annoA: annoScorso, annoB: annoCorrente,
      finA: norm(righeTot.find(r=>r.anno===annoScorso)),
      finB: norm(righeTot.find(r=>r.anno===annoCorrente)),
    };
  } else {
    const { data: mensile } = await sb.rpc("andamento_mensile", { p_periodo: periodo });
    const righe = mensile||[];
    mesiLabels = righe.map(r=>{
      const [y,m] = String(r.mese).slice(0,7).split("-").map(Number);
      return new Date(y, m-1, 1).toLocaleDateString("it-IT", periodo==="rolling12" ? {month:"short",year:"2-digit"} : {month:"short"});
    });
    fatturatoMensile = righe.map(r=>Number(r.fatturato)||0);
    saldoMensile = righe.map(r=>Number(r.saldo)||0);
  }

  state._andamentoCharts = {
    periodo, fin, confrontoBarre,
    mesiLabels, fatturatoMensile, saldoMensile, fatturatoMensileB, saldoMensileB, legendaAnnoA, legendaAnnoB,
  };
  return `
    <div class="card">
      <h2>Andamento dell'azienda</h2>
      <p><small class="hint">Vista di sola lettura riservata a soci/azionisti e amministratore: solo dati e totali aggregati, nessun dettaglio su singoli clienti/cantieri.</small></p>
      <div class="pill-select" id="filtro-periodo-andamento">
        <button data-p="rolling12" class="${periodo==="rolling12"?"active":""}">Da sempre</button>
        <button data-p="annocorrente" class="${periodo==="annocorrente"?"active":""}">Anno corrente (${annoCorrente})</button>
        <button data-p="annoscorso" class="${periodo==="annoscorso"?"active":""}">Anno scorso (${annoScorso})</button>
        <button data-p="confronto" class="${periodo==="confronto"?"active":""}">Confronta ${annoScorso} vs ${annoCorrente}</button>
      </div>
      <p><small class="hint">Periodo selezionato: ${escapeHtml(etichettaPeriodo)}. I dati di clienti/cantieri/service order attivi e il valore di magazzino sono sempre riferiti ad oggi.</small></p>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${fmtMoney(fin.fatturato)}</div><div class="lbl">Fatturato</div></div>
      <div class="kpi"><div class="num">${fmtMoney(fin.incassato)}</div><div class="lbl">Incassato</div></div>
      <div class="kpi"><div class="num">${fmtMoney(fin.daIncassare)}</div><div class="lbl">Da incassare</div></div>
      <div class="kpi"><div class="num">${fmtMoney(fin.costi)}</div><div class="lbl">Costi (fatture da fornitori)</div></div>
      <div class="kpi"><div class="num">${fmtMoney(fin.utile)}</div><div class="lbl">Utile stimato</div></div>
      <div class="kpi"><div class="num">${fmtMoney(fin.saldo)}</div><div class="lbl">Saldo cassa/banca (periodo)</div></div>
      <div class="kpi"><div class="num">${fmtMoney(valMagazzino)}</div><div class="lbl">Valore magazzino (a listino, ad oggi)</div></div>
      <div class="kpi"><div class="num">${clientiAttivi}</div><div class="lbl">Clienti attivi (ad oggi)</div></div>
      <div class="kpi"><div class="num">${cantieriAttivi}</div><div class="lbl">Cantieri attivi (ad oggi)</div></div>
      <div class="kpi"><div class="num">${soAperti}</div><div class="lbl">Service Order attivi (ad oggi)</div></div>
    </div>
    <div class="charts-grid">
      <div class="card">
        <h2>Fatturato, costi e utile</h2>
        <div class="chart-wrap"><canvas id="chart-fattcostiutile"></canvas></div>
      </div>
      <div class="card">
        <h2>Composizione fatturato clienti</h2>
        <div class="chart-wrap"><canvas id="chart-incassato"></canvas></div>
      </div>
      <div class="card" style="grid-column:1 / -1;">
        <h2>Andamento mensile del fatturato</h2>
        <div class="chart-wrap"><canvas id="chart-fatturato-mensile"></canvas></div>
      </div>
      <div class="card" style="grid-column:1 / -1;">
        <h2>Saldo netto di cassa (entrate − uscite) per mese</h2>
        <div class="chart-wrap"><canvas id="chart-cassa-mensile"></canvas></div>
      </div>
    </div>
  `;
}

// ============================================================
// REPORT AVANZATI E AUTOMAZIONI (FASE V6)
// Tutto calcolato nel browser a partire dai dati che il ruolo può già
// leggere: nessuna nuova tabella, nessun servizio esterno a pagamento.
// L'ultimo report ("Clienti da ricontattare") è un suggerimento
// automatico basato su regole (non un vero servizio di intelligenza
// artificiale esterno, che avrebbe un costo).
// ============================================================
function calcolaFatturatoPerCliente(){
  const map = {};
  state.data.fatture.filter(f=>f.tipo==="emessa").forEach(f=>{
    const key = f.cliente_id;
    if(!map[key]) map[key] = { clienteId:key, fatturato:0, incassato:0, daIncassare:0 };
    const importo = Number(f.importo_totale)||0;
    map[key].fatturato += importo;
    if(f.stato==="pagata") map[key].incassato += importo; else map[key].daIncassare += importo;
  });
  return Object.values(map).sort((a,b)=>b.fatturato-a.fatturato);
}
function fasciaRitardo(giorni){
  if(giorni<=30) return tr("0-30 giorni","0-30 jours");
  if(giorni<=60) return tr("31-60 giorni","31-60 jours");
  if(giorni<=90) return tr("61-90 giorni","61-90 jours");
  return tr("Oltre 90 giorni","Plus de 90 jours");
}
function calcolaFattureScadute(){
  const oggi = new Date(new Date().toDateString());
  return state.data.fatture.filter(f=>f.tipo==="emessa" && isScaduta(f)).map(f=>{
    const giorni = Math.floor((oggi - new Date(f.data_scadenza)) / (1000*60*60*24));
    return { fattura:f, giorniRitardo: giorni, fascia: fasciaRitardo(giorni) };
  }).sort((a,b)=>b.giorniRitardo-a.giorniRitardo);
}
function calcolaArticoliVenduti(){
  const idsAccettati = new Set(state.data.preventivi.filter(p=>p.stato==="accettato").map(p=>p.id));
  const map = {};
  state.data.preventivoRighe.filter(r=>idsAccettati.has(r.preventivo_id) && r.tipo_prezzo==="vendita").forEach(r=>{
    if(!r.articolo_id) return;
    if(!map[r.articolo_id]) map[r.articolo_id] = { articoloId:r.articolo_id, quantita:0, valore:0 };
    map[r.articolo_id].quantita += Number(r.quantita)||0;
    map[r.articolo_id].valore += totaleRiga(r);
  });
  return Object.values(map).sort((a,b)=>b.valore-a.valore);
}
function calcolaArticoliNoleggiati(){
  const idsAccettati = new Set(state.data.preventivi.filter(p=>p.stato==="accettato").map(p=>p.id));
  const map = {};
  state.data.preventivoRighe.filter(r=>idsAccettati.has(r.preventivo_id) && r.tipo_prezzo && r.tipo_prezzo.indexOf("noleggio")===0).forEach(r=>{
    if(!r.articolo_id) return;
    if(!map[r.articolo_id]) map[r.articolo_id] = { articoloId:r.articolo_id, quantita:0, valore:0, perDurata:{ noleggio_giornaliero:0, noleggio_settimanale:0, noleggio_mensile:0 } };
    map[r.articolo_id].quantita += Number(r.quantita)||0;
    map[r.articolo_id].valore += totaleRiga(r);
    map[r.articolo_id].perDurata[r.tipo_prezzo] = (map[r.articolo_id].perDurata[r.tipo_prezzo]||0) + (Number(r.quantita)||0);
  });
  return Object.values(map).sort((a,b)=>b.valore-a.valore);
}
function calcolaClientiDaRicontattare(){
  const oggi = new Date(new Date().toDateString());
  const risultato = [];
  state.data.clienti.forEach(c=>{
    const stato = c.stato_crm||"prospect";
    if(stato==="cliente_inattivo") return;
    let motivo = null, urgenza = 0;
    if(c.prossimo_contatto){
      const pc = new Date(c.prossimo_contatto);
      const giorni = Math.floor((oggi - pc) / (1000*60*60*24));
      if(giorni>=0){ motivo = giorni===0? "Contatto programmato per oggi" : `Contatto programmato in ritardo di ${giorni} giorni`; urgenza = 1000 + giorni; }
    }
    if(!motivo && !c.ultimo_contatto){
      motivo = "Non è ancora stato contattato"; urgenza = 500;
    } else if(!motivo && c.ultimo_contatto){
      const giorni = Math.floor((oggi - new Date(c.ultimo_contatto)) / (1000*60*60*24));
      if(giorni>60){ motivo = `Nessun contatto da ${giorni} giorni`; urgenza = giorni; }
    }
    if(motivo) risultato.push({ cliente:c, motivo, urgenza });
  });
  return risultato.sort((a,b)=>b.urgenza-a.urgenza);
}
function viewReport(){

function renderReportFattureScadute(){
  const righe = calcolaFattureScadute();
  const fasce = [fasciaRitardo(0), fasciaRitardo(31), fasciaRitardo(61), fasciaRitardo(91)];
  const totali = fasce.map(fa=>righe.filter(r=>r.fascia===fa).reduce((s,r)=>s+Number(r.fattura.importo_totale),0));

function statoCrmClass(s){ const map={prospect:"in_revisione",contattato:"in_uso",preventivo_inviato:"in_corso",cliente:"chiuso",cliente_inattivo:"danneggiato"}; return map[s]||"in_revisione"; }
function potenzialeLabel(s){ const map=tr({basso:"Basso",medio:"Medio",alto:"Alto"},{basso:"Faible",medio:"Moyen",alto:"Élevé"}); return map[s]||"-"; }

// DOCUMENTI (upload/scansione/foto, legati a cliente o cantiere)
// ============================================================
function renderModaleDocumenti(entitaTipo, entitaId, titolo){
  const docs = state.data.documenti.filter(x=>x.entita_tipo===entitaTipo && x.entita_id===entitaId);
  const ruolo = myRole();
  const puoCaricare = ["commerciale","contabile","admin"].includes(ruolo);
  const body = `
    ${puoCaricare? `
    <form id="form-documento">
      <label>Carica file, scatta una foto o scansiona il documento</label>
      <input type="file" id="doc-file" accept="image/*,application/pdf" capture="environment" required>
      <div style="margin-top:10px;"><button type="submit">Carica documento</button></div>
    </form>` : ""}
    <div id="doc-upload-msg"></div>
    <table style="margin-top:14px;"><thead><tr><th>File</th><th>Caricato il</th><th></th></tr></thead>
    <tbody>
      ${docs.length===0? `<tr><td colspan="3" class="empty">Nessun documento caricato.</td></tr>` : docs.map(doc=>`
        <tr>
          <td><a href="#" class="link-documento" data-path="${escapeHtml(doc.path||"")}">${escapeHtml(doc.nome_file)}</a></td>
          <td>${fmtDate(doc.created_at)}</td>
          <td>${ruolo==="admin"? `<button class="secondary btn-elimina-doc" data-id="${doc.id}">Elimina</button>` : ""}</td>
        </tr>
      `).join("")}
    </tbody></table>
  `;
  openModal(titolo, body, (bodyEl)=>{
    const f = bodyEl.querySelector("#form-documento");
    if(f) f.onsubmit = async (e)=>{
      e.preventDefault();
      const input = bodyEl.querySelector("#doc-file");
      const file = input.files[0];
      if(!file) return;
      const msg = bodyEl.querySelector("#doc-upload-msg");
      msg.innerHTML = `<div class="msg">Caricamento in corso...</div>`;
      const path = `${entitaTipo}/${entitaId}/${Date.now()}_${file.name}`;
      const { error: upErr } = await sb.storage.from("documenti").upload(path, file);
      if(upErr){ msg.innerHTML = `<div class="msg error">Errore caricamento: ${escapeHtml(upErr.message)}</div>`; return; }
      // Il bucket "documenti" è privato: salviamo solo il percorso interno,
      // il link per aprirlo viene generato al volo (valido un'ora) solo per chi ha accesso.
      const { error: insErr } = await sb.from("documenti").insert({
        entita_tipo: entitaTipo, entita_id: entitaId, nome_file: file.name,
        path, content_type: file.type || null, caricato_da: state.session.user.id,
      });
      if(insErr){ msg.innerHTML = `<div class="msg error">Errore salvataggio: ${escapeHtml(insErr.message)}</div>`; return; }
      await loadAll();
      renderModaleDocumenti(entitaTipo, entitaId, titolo);
    };
    bodyEl.querySelectorAll(".link-documento").forEach(a=>{
      a.onclick = async (e)=>{
        e.preventDefault();
        const path = a.dataset.path;
        if(!path){ alert("Documento non disponibile (caricato prima dell'aggiornamento di sicurezza)."); return; }
        const { data, error } = await sb.storage.from("documenti").createSignedUrl(path, 3600);
        if(error || !data){ alert("Errore apertura documento: "+(error?error.message:"")); return; }
        window.open(data.signedUrl, "_blank", "noopener");
      };
    });
    bodyEl.querySelectorAll(".btn-elimina-doc").forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm("Eliminare questo documento?")) return;
        const { error } = await sb.from("documenti").delete().eq("id", b.dataset.id);
        if(error){ alert("Errore: "+error.message); return; }
        await loadAll();
        renderModaleDocumenti(entitaTipo, entitaId, titolo);
      };
    });
  });
}

function wireMagazzino(){
  const f = document.getElementById("form-articolo");
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      codice: document.getElementById("a-codice").value.trim(),
      descrizione: document.getElementById("a-descrizione").value.trim(),
      dimensioni: document.getElementById("a-dimensioni").value.trim() || null,
      peso: document.getElementById("a-peso").value.trim() || null,
      lunghezza_unitaria: document.getElementById("a-lunghezza").value.trim()? Number(document.getElementById("a-lunghezza").value) : null,
      immagine_url: document.getElementById("a-immagine").value.trim() || null,
      note: document.getElementById("a-note").value.trim() || null,
    };
    const { error } = await sb.from("articoli").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-edit-articolo").forEach(b=>{ b.onclick = ()=>editArticolo(b.dataset.id); });
  wireExportButtons("exp-articoli", "magazzino", "Magazzino",
    ["Codice","Descrizione","Dimensioni","Peso","Pezzi totali","Disponibili"],
    ()=>state.data.articoli.map(a=>{
      const pezziArt = state.data.pezzi.filter(p=>p.articolo_id===a.id);
      return [a.codice, a.descrizione, a.dimensioni||"", a.peso||"", pezziArt.length, pezziArt.filter(p=>p.stato==="disponibile").length];
    })
  );
  const selMt = document.getElementById("mt-articolo");
  const inputMt = document.getElementById("mt-richiesta");
  const risMt = document.getElementById("mt-risultato");
  function aggiornaMetratura(){
    if(!selMt || !risMt) return;
    const a = state.data.articoli.find(x=>x.id===selMt.value);
    const richiesta = Number(inputMt.value)||0;
    if(!a || !a.lunghezza_unitaria){ risMt.textContent = "-"; return; }
    const pezziNecessari = Math.ceil(richiesta / a.lunghezza_unitaria);
    const disponibili = state.data.pezzi.filter(p=>p.articolo_id===a.id && p.stato==="disponibile").length;
    risMt.className = "msg " + (pezziNecessari<=disponibili? "ok" : "error");
    risMt.textContent = `Servono ${pezziNecessari} pezzi da ${a.lunghezza_unitaria} m (totale ${(pezziNecessari*a.lunghezza_unitaria).toFixed(2)} m). Disponibili in magazzino: ${disponibili}.` + (pezziNecessari>disponibili? " Attenzione: non ce ne sono abbastanza in magazzino." : "");
  }
  if(selMt){ selMt.onchange = aggiornaMetratura; inputMt.oninput = aggiornaMetratura; aggiornaMetratura(); }
}

        <button data-f="in_revisione">In revisione</button>
        <button data-f="da_riparare">Da riparare</button>
        <button data-f="danneggiato">Danneggiati</button>
        <button data-f="fuori_servizio">Fuori servizio</button>
      </div>
      <div id="tabella-pezzi"></div>
    </div>
  `;
}
function renderTabellaPezzi(filtro){
  let rows = state.data.pezzi;
  if(filtro && filtro!=="tutti") rows = rows.filter(p=>p.stato===filtro);
  const puoModificare = ["magazzino","admin"].includes(myRole());
  const html = rows.length===0? `<div class="empty">Nessun pezzo trovato.</div>` : `
    <table><thead><tr><th>DTR</th><th>Articolo</th><th>Stato</th><th>Posizione</th><th>Cliente/Cantiere</th><th></th></tr></thead>
    <tbody>
      ${rows.map(p=>`
        <tr>
          <td>${escapeHtml(p.dtr)}</td>
          <td>${escapeHtml(articoloLabel(p.articolo_id))}</td>
          <td>${badge(p.stato)}</td>
          <td>${escapeHtml(p.posizione||"-")}</td>
          <td>${p.cliente_id? escapeHtml(clienteNome(p.cliente_id))+(p.cantiere_id? " / "+escapeHtml(cantiereNome(p.cantiere_id)) : "") : "-"}</td>
          <td style="white-space:nowrap;">
            <button class="secondary btn-etichetta-pezzo" data-id="${p.id}">🏷️</button>
            ${puoModificare? `<button class="secondary btn-edit-pezzo" data-id="${p.id}">Modifica</button>` : ""}
          </td>
        </tr>
      `).join("")}
    </tbody></table>`;
  document.getElementById("tabella-pezzi").innerHTML = html;
  document.querySelectorAll(".btn-edit-pezzo").forEach(b=>{ b.onclick = ()=>editPezzo(b.dataset.id, filtro); });
  document.querySelectorAll(".btn-etichetta-pezzo").forEach(b=>{
    b.onclick = ()=>{
      const p = state.data.pezzi.find(x=>x.id===b.dataset.id);
      if(p) stampaEtichetteQR([p]);
    };
  });
}
function wirePezzi(){
  const f = document.getElementById("form-pezzo");
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      articolo_id: document.getElementById("p-articolo").value,
      dtr: document.getElementById("p-dtr").value.trim(),
      posizione: document.getElementById("p-posizione").value.trim() || null,
      stato: "disponibile",
    };
    const { error } = await sb.from("pezzi").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnStampaTutte = document.getElementById("btn-stampa-etichette-tutte");
  if(btnStampaTutte) btnStampaTutte.onclick = ()=>{
    const disponibili = state.data.pezzi.filter(p=>p.stato==="disponibile");
    if(disponibili.length===0){ alert("Nessun pezzo disponibile da etichettare."); return; }
    if(disponibili.length>60 && !confirm(`Stai per generare ${disponibili.length} etichette: potrebbe richiedere qualche secondo. Continuare?`)) return;
    stampaEtichetteQR(disponibili);
  };
  const btnScanDtr = document.getElementById("btn-scan-dtr");
  if(btnScanDtr) btnScanDtr.onclick = ()=>{
    apriScannerQR((testo)=>{ document.getElementById("p-dtr").value = testo; });
  };
  renderTabellaPezzi("tutti");
  document.querySelectorAll("#filtro-stato button").forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll("#filtro-stato button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      renderTabellaPezzi(b.dataset.f);
    };
  });
}
function editPezzo(id){
  const p = state.data.pezzi.find(x=>x.id===id);
  if(!p) return;
  const soloAdmin = myRole()==="admin";
  const articoliOpts = state.data.articoli.map(a=>`<option value="${a.id}" ${a.id===p.articolo_id?"selected":""}>${escapeHtml(a.codice)} - ${escapeHtml(a.descrizione)}</option>`).join("");
  const stati = ["disponibile","in_uso","in_revisione","da_riparare","danneggiato","fuori_servizio"];
  const body = `
    <form id="form-edit-pezzo">
      <div class="form-grid">
        <div><label>Articolo *</label><select required id="ep-articolo">${articoliOpts}</select></div>
        <div><label>DTR (codice univoco) *</label>
          <input required id="ep-dtr" value="${escapeHtml(p.dtr)}" ${soloAdmin? "" : "readonly disabled"}>
          ${soloAdmin? "" : `<small class="hint">Solo l'amministratore può modificare il codice DTR.</small>`}
        </div>
        <div><label>Posizione in magazzino</label><input id="ep-posizione" value="${escapeHtml(p.posizione||"")}"></div>
        <div><label>Stato</label><select id="ep-stato">${stati.map(s=>`<option value="${s}" ${s===p.stato?"selected":""}>${statoLabel(s)}</option>`).join("")}</select></div>
      </div>
      <div class="actions" style="margin-top:14px;">
        <button type="submit">Salva modifiche</button>
        <button type="button" class="secondary" id="btn-annulla-edit">Annulla</button>
        ${myRole()==="admin"? `<button type="button" class="danger" id="btn-elimina-edit">Elimina pezzo</button>` : ""}
      </div>
    </form>
  `;
  openModal("Modifica pezzo", body, (bodyEl)=>{
    bodyEl.querySelector("#btn-annulla-edit").onclick = closeModal;
    const btnDel = bodyEl.querySelector("#btn-elimina-edit");
    if(btnDel) btnDel.onclick = ()=>confirmDelete("pezzi", id, `il pezzo "${p.dtr}"`);
    bodyEl.querySelector("#form-edit-pezzo").onsubmit = async (e)=>{
      e.preventDefault();
      const payload = {
        articolo_id: bodyEl.querySelector("#ep-articolo").value,
        posizione: bodyEl.querySelector("#ep-posizione").value.trim() || null,
        stato: bodyEl.querySelector("#ep-stato").value,
        updated_at: new Date().toISOString(),
      };
      if(soloAdmin) payload.dtr = bodyEl.querySelector("#ep-dtr").value.trim();
      const { error } = await sb.from("pezzi").update(payload).eq("id", id);
      if(error){ alert("Errore: "+error.message); return; }
      closeModal();
      render();
    };
  });
}

    selCantiere.innerHTML = `<option value="">-- nessuno --</option>` + opts;

    b.onclick = ()=>{ state.soAperto = b.dataset.id; render(); };

}

function wireServiceOrderDettaglio(id){
  document.getElementById("btn-torna-so").onclick = ()=>{ state.soAperto=null; render(); };
  const so = state.data.serviceOrders.find(s=>s.id===id);
  renderCommentiSO(id);
  const fCommento = document.getElementById("form-commento-so");
  if(fCommento) fCommento.onsubmit = async (e)=>{
    e.preventDefault();
    const testo = document.getElementById("cm-testo").value.trim();
    if(!testo) return;
    const { error } = await sb.from("commenti_service_order").insert({ service_order_id: id, testo, creato_da: state.session.user.id });
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnChiudi = document.getElementById("btn-chiudi-so");
  if(btnChiudi) btnChiudi.onclick = async ()=>{
    const { error } = await sb.from("service_orders").update({ stato:"chiuso", data_chiusura: new Date().toISOString() }).eq("id", id);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnRiapri = document.getElementById("btn-riapri-so");
  if(btnRiapri) btnRiapri.onclick = async ()=>{
    if(!confirm("Riaprire questo Service Order?")) return;
    const { error } = await sb.from("service_orders").update({ stato:"aperto", data_chiusura: null }).eq("id", id);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnEliminaSo = document.getElementById("btn-elimina-so");
  if(btnEliminaSo) btnEliminaSo.onclick = ()=>confirmDelete("service_orders", id, `il Service Order #${soNumero(so.numero)}`, ()=>{ state.soAperto=null; });
  const inputScadenza = document.getElementById("so-scadenza-edit");
  if(inputScadenza) inputScadenza.onchange = async ()=>{
    const { error } = await sb.from("service_orders").update({ data_scadenza: inputScadenza.value || null }).eq("id", id);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  function scansionaESeleziona(selectId){
    apriScannerQR((testo)=>{
      const sel = document.getElementById(selectId);
      if(!sel) return;
      const opt = Array.from(sel.options).find(o=>o.textContent.toLowerCase().includes(testo.toLowerCase()));
      if(opt) sel.value = opt.value;
      else alert("Nessun pezzo trovato in elenco con il codice: "+testo);
    });
  }
  const btnScanPrelievo = document.getElementById("btn-scan-prelievo");
  if(btnScanPrelievo) btnScanPrelievo.onclick = ()=>scansionaESeleziona("pr-pezzo");
  const btnScanReso = document.getElementById("btn-scan-reso");
  if(btnScanReso) btnScanReso.onclick = ()=>scansionaESeleziona("re-pezzo");
  const fPrelievo = document.getElementById("form-prelievo");
  if(fPrelievo) fPrelievo.onsubmit = async (e)=>{
    e.preventDefault();
    const pezzoId = document.getElementById("pr-pezzo").value;
    const { error: e1 } = await sb.from("pezzi").update({
      stato:"in_uso", cliente_id: so.cliente_id, cantiere_id: so.cantiere_id, updated_at: new Date().toISOString()
    }).eq("id", pezzoId);
    if(e1){ alert("Errore: "+e1.message); return; }
    const { error: e2 } = await sb.from("service_order_righe").insert({ service_order_id: id, pezzo_id: pezzoId, azione:"prelievo" });
    if(e2){ alert("Errore: "+e2.message); return; }
    render();
  };
  const fReso = document.getElementById("form-reso");
  if(fReso) fReso.onsubmit = async (e)=>{
    e.preventDefault();
    const pezzoId = document.getElementById("re-pezzo").value;
    const nuovoStato = document.getElementById("re-stato").value;
    const { error: e1 } = await sb.from("pezzi").update({
      stato: nuovoStato, cliente_id: null, cantiere_id: null, updated_at: new Date().toISOString()
    }).eq("id", pezzoId);
    if(e1){ alert("Errore: "+e1.message); return; }
    const { error: e2 } = await sb.from("service_order_righe").insert({ service_order_id: id, pezzo_id: pezzoId, azione:"reso" });
    if(e2){ alert("Errore: "+e2.message); return; }
    render();
  };
}

        prezzo_vendita: parseFloat(tr.querySelector(".lp-vendita").value) || null,
        prezzo_noleggio_giornaliero: parseFloat(tr.querySelector(".lp-giorno").value) || null,
        prezzo_noleggio_settimanale: parseFloat(tr.querySelector(".lp-settimana").value) || null,
        prezzo_noleggio_mensile: parseFloat(tr.querySelector(".lp-mese").value) || null,
        iva_percentuale: parseFloat(tr.querySelector(".lp-iva").value) || 0,
        updated_at: new Date().toISOString(),
      };
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Salvataggio...";
      const { data, error } = await sb.from("listino_prezzi").upsert(payload, { onConflict: "articolo_id" }).select();
      if(error){
        alert("Errore nel salvataggio: "+error.message+"\n\n(Codice: "+(error.code||"n/d")+")");
        btn.disabled = false;
        btn.textContent = originalLabel;
        return;
      }
      if(data && data[0]){
        const idx = state.data.listino.findIndex(l=>l.articolo_id===payload.articolo_id);
        if(idx>=0) state.data.listino[idx] = data[0]; else state.data.listino.push(data[0]);
      }
      btn.textContent = "✓ Salvato";
      setTimeout(()=>{ btn.disabled=false; btn.textContent = originalLabel; }, 1500);
    };
  });
}

      .map(k=>`<option value="${k.id}">${escapeHtml(k.nome)}</option>`).join("");
    selCantiere.innerHTML = `<option value="">-- nessuno --</option>` + opts;

    e.preventDefault();

function wirePreventivoDettaglio(id){
  document.getElementById("btn-torna-pv").onclick = ()=>{ state.preventivoAperto=null; render(); };
  document.getElementById("btn-stampa-pv").onclick = ()=>{ stampaPreventivo(id); };
  const btnEliminaPv = document.getElementById("btn-elimina-pv");
  if(btnEliminaPv){
    const pv = state.data.preventivi.find(p=>p.id===id);
    btnEliminaPv.onclick = ()=>confirmDelete("preventivi", id, `il preventivo #${pv? pv.numero : ""}`, ()=>{ state.preventivoAperto=null; });
  }
  document.querySelectorAll(".btn-stato-pv").forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from("preventivi").update({ stato: b.dataset.stato }).eq("id", id);
      if(error){ alert("Errore: "+error.message); return; }
      render();
    };
  });
  const btnCreaSO = document.getElementById("btn-crea-so-da-pv");
  if(btnCreaSO) btnCreaSO.onclick = async ()=>{
    const pv = state.data.preventivi.find(p=>p.id===id);
    const { error } = await sb.from("service_orders").insert({
      cliente_id: pv.cliente_id, cantiere_id: pv.cantiere_id, preventivo_id: pv.id,
      stato: "aperto", created_by: state.session.user.id,
    });
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const rpArticolo = document.getElementById("rp-articolo");
  const rpTipo = document.getElementById("rp-tipo");
  const rpPrezzo = document.getElementById("rp-prezzo");
  function autoPrezzo(){
    if(!rpArticolo) return;
    const l = prezzoArticolo(rpArticolo.value);
    if(!l) return;
    const map = { vendita:"prezzo_vendita", noleggio_giornaliero:"prezzo_noleggio_giornaliero", noleggio_settimanale:"prezzo_noleggio_settimanale", noleggio_mensile:"prezzo_noleggio_mensile" };
    const v = l[map[rpTipo.value]];
    if(v!=null) rpPrezzo.value = v;
  }
  if(rpArticolo){ autoPrezzo(); rpArticolo.onchange = autoPrezzo; rpTipo.onchange = autoPrezzo; }
  const fRiga = document.getElementById("form-riga-pv");
  if(fRiga) fRiga.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      preventivo_id: id,
      articolo_id: rpArticolo.value,
      tipo_prezzo: rpTipo.value,
      quantita: parseFloat(document.getElementById("rp-quantita").value) || 1,
      prezzo_unitario: parseFloat(rpPrezzo.value) || 0,
      sconto_percentuale: parseFloat(document.getElementById("rp-sconto").value) || 0,
    };
    const { error } = await sb.from("preventivo_righe").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-rimuovi-riga").forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from("preventivo_righe").delete().eq("id", b.dataset.id);
      if(error){ alert("Errore: "+error.message); return; }
      render();
    };
  });
}

function renderInventarioRisultato(p, testoScansionato){
  const el = document.getElementById("inv-risultato");
  if(!el) return;
  if(!p){
    el.innerHTML = `<div class="card"><div class="msg error">Nessun pezzo trovato con il codice "${escapeHtml(testoScansionato)}".</div></div>`;
    return;
  }
  const stati = ["disponibile","in_uso","in_revisione","da_riparare","danneggiato","fuori_servizio"];
  el.innerHTML = `
    <div class="card">
      <h2>${escapeHtml(p.dtr)} ${badge(p.stato)}</h2>
      <p><strong>Articolo:</strong> ${escapeHtml(articoloLabel(p.articolo_id))}<br>
         ${p.cliente_id? `<strong>Presso:</strong> ${escapeHtml(clienteNome(p.cliente_id))}${p.cantiere_id? " / "+escapeHtml(cantiereNome(p.cantiere_id)) : ""}<br>` : ""}
         <strong>Ultima verifica inventario:</strong> ${p.ultima_verifica_inventario? fmtDate(p.ultima_verifica_inventario) : "mai"}</p>
      <div class="form-grid">
        <div><label>Aggiorna stato</label><select id="inv-stato">${stati.map(s=>`<option value="${s}" ${s===p.stato?"selected":""}>${statoLabel(s)}</option>`).join("")}</select></div>
        <div><label>Posizione</label><input id="inv-posizione" value="${escapeHtml(p.posizione||"")}"></div>
      </div>
      <div class="actions" style="margin-top:10px;">
        <button id="btn-inv-conferma">✔️ Conferma presente</button>
        <button class="secondary" id="btn-inv-salva">Salva modifiche</button>
        <button class="secondary" id="btn-inv-prossimo">📷 Scansiona il prossimo</button>
      </div>
      <div id="inv-msg"></div>
    </div>
  `;
  document.getElementById("btn-inv-conferma").onclick = async ()=>{
    const msg = document.getElementById("inv-msg");
    const { error } = await sb.from("pezzi").update({ ultima_verifica_inventario: new Date().toISOString() }).eq("id", p.id);
    if(error){ msg.innerHTML = `<div class="msg error">Errore: ${escapeHtml(error.message)}</div>`; return; }
    await loadAll();
    msg.innerHTML = `<div class="msg ok">Presenza confermata.</div>`;
  };
  document.getElementById("btn-inv-salva").onclick = async ()=>{
    const msg = document.getElementById("inv-msg");
    const payload = {
      stato: document.getElementById("inv-stato").value,
      posizione: document.getElementById("inv-posizione").value.trim() || null,
      ultima_verifica_inventario: new Date().toISOString(),
    };
    const { error } = await sb.from("pezzi").update(payload).eq("id", p.id);
    if(error){ msg.innerHTML = `<div class="msg error">Errore: ${escapeHtml(error.message)}</div>`; return; }
    await loadAll();
    msg.innerHTML = `<div class="msg ok">Modifiche salvate.</div>`;
  };
  document.getElementById("btn-inv-prossimo").onclick = ()=>{
    apriScannerQR((testo)=>{
      const pNext = state.data.pezzi.find(x=>x.dtr && x.dtr.toLowerCase()===testo.toLowerCase());
      renderInventarioRisultato(pNext, testo);
    });
  };
}

    if(!selCliente) return;
    const opts = state.data.cantieri.filter(k=>k.cliente_id===selCliente.value)
      .map(k=>`<option value="${k.id}">${escapeHtml(k.nome)}</option>`).join("");
    selCantiere.innerHTML = `<option value="">-- nessuno --</option>` + opts;
  }
  if(selCliente){ aggiornaCantieri(); selCliente.onchange = aggiornaCantieri; }
  const f = document.getElementById("form-ddt");
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      cliente_id: selCliente.value,
      cantiere_id: selCantiere.value || null,
      causale: document.getElementById("ddt-causale").value.trim() || null,
      note: document.getElementById("ddt-note").value.trim() || null,
      stato: "aperto",
      creato_da: state.session.user.id,
    };
    const { error } = await sb.from("ddt").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  document.querySelectorAll(".btn-apri-ddt").forEach(b=>{ b.onclick = ()=>{ state.ddtAperto = b.dataset.id; render(); }; });
  wireExportButtons("exp-ddt", "ddt", "DDT",
    ["Numero","Cliente","Cantiere","Causale","Stato","Apertura","Chiusura","Note"],
    ()=>state.data.ddt.map(dd=>[ddtNumero(dd.numero), clienteNome(dd.cliente_id), cantiereNome(dd.cantiere_id), dd.causale||"", statoLabel(dd.stato), fmtDate(dd.data_apertura), dd.data_chiusura? fmtDate(dd.data_chiusura):"", dd.note||""])
  );
}
function viewDDTDettaglio(id){
  const dd = state.data.ddt.find(x=>x.id===id);
  if(!dd){ state.ddtAperto=null; return viewDDT(); }
  const righe = state.data.ddtRighe.filter(r=>r.ddt_id===id);
  const articoliOpts = state.data.articoli.map(a=>`<option value="${a.id}">${escapeHtml(a.codice)} - ${escapeHtml(a.descrizione)}</option>`).join("");
  const puoModificare = ["magazzino","commerciale","admin"].includes(myRole()) && dd.stato==="aperto";
  return `
    <button class="secondary" id="btn-torna-ddt">&larr; Torna all'elenco</button>
    <div class="card" style="margin-top:14px;">
      <h2>DDT #${ddtNumero(dd.numero)} ${badge(dd.stato)}</h2>
      <p><strong>Cliente:</strong> ${escapeHtml(clienteNome(dd.cliente_id))} &nbsp;
         <strong>Cantiere:</strong> ${escapeHtml(cantiereNome(dd.cantiere_id))} &nbsp;
         <strong>Aperto il:</strong> ${fmtDate(dd.data_apertura)}
         ${dd.data_chiusura? ` &nbsp; <strong>Chiuso il:</strong> ${fmtDate(dd.data_chiusura)}` : ""}</p>
      ${dd.causale? `<p><strong>Causale:</strong> ${escapeHtml(dd.causale)}</p>` : ""}
      ${dd.note? `<p><em>${escapeHtml(dd.note)}</em></p>` : ""}
      <div class="actions">
        <button class="secondary" id="btn-stampa-ddt">🖨️ Stampa DDT</button>
        ${dd.stato==="aperto"? `<button class="secondary" id="btn-chiudi-ddt">Chiudi DDT</button>` : ""}
        ${dd.stato==="chiuso" && myRole()==="admin"? `<button class="secondary" id="btn-riapri-ddt">Riapri DDT</button>` : ""}
        ${dd.stato==="chiuso" && myRole()!=="admin"? `<small class="hint">Solo l'amministratore può riaprire un DDT chiuso.</small>` : ""}
        ${myRole()==="admin"? `<button class="danger" id="btn-elimina-ddt">Elimina DDT</button>` : ""}
      </div>
    </div>
    <div class="card">
      <h2>Righe di carico</h2>
      ${puoModificare? `
      <form id="form-riga-ddt">
        <div class="form-grid">
          <div><label>Articolo</label><select id="rd-articolo">${articoliOpts}</select></div>
          <div><label>Descrizione (facoltativa, es. per merce non a catalogo)</label><input id="rd-descrizione"></div>
          <div><label>Quantità *</label><input required type="number" step="0.01" min="0.01" id="rd-quantita" value="1"></div>
        </div>
        <div style="margin-top:10px;"><button type="submit">Aggiungi riga</button></div>
      </form>` : ""}
      <table style="margin-top:14px;"><thead><tr><th>Articolo</th><th>Descrizione</th><th style="text-align:right;">Quantità</th></tr></thead>
      <tbody>
        ${righe.length===0? `<tr><td colspan="3" class="empty">Nessuna riga di carico.</td></tr>` : righe.map(r=>`
          <tr><td>${r.articolo_id? escapeHtml(articoloLabel(r.articolo_id)) : "-"}</td><td>${escapeHtml(r.descrizione||"-")}</td><td style="text-align:right;">${r.quantita}</td></tr>
        `).join("")}
      </tbody></table>
    </div>
  `;
}
function wireDDTDettaglio(id){
  document.getElementById("btn-torna-ddt").onclick = ()=>{ state.ddtAperto=null; render(); };
  const dd = state.data.ddt.find(x=>x.id===id);
  document.getElementById("btn-stampa-ddt").onclick = ()=>stampaDDT(id);
  const btnChiudi = document.getElementById("btn-chiudi-ddt");
  if(btnChiudi) btnChiudi.onclick = async ()=>{
    const { error } = await sb.from("ddt").update({ stato:"chiuso", data_chiusura: new Date().toISOString() }).eq("id", id);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnRiapri = document.getElementById("btn-riapri-ddt");
  if(btnRiapri) btnRiapri.onclick = async ()=>{
    if(!confirm("Riaprire questo DDT?")) return;
    const { error } = await sb.from("ddt").update({ stato:"aperto", data_chiusura: null }).eq("id", id);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
  const btnElimina = document.getElementById("btn-elimina-ddt");
  if(btnElimina) btnElimina.onclick = ()=>confirmDelete("ddt", id, `il DDT #${ddtNumero(dd.numero)}`, ()=>{ state.ddtAperto=null; });
  const fRiga = document.getElementById("form-riga-ddt");
  if(fRiga) fRiga.onsubmit = async (e)=>{
    e.preventDefault();
    const payload = {
      ddt_id: id,
      articolo_id: document.getElementById("rd-articolo").value || null,
      descrizione: document.getElementById("rd-descrizione").value.trim() || null,
      quantita: Number(document.getElementById("rd-quantita").value),
    };
    const { error } = await sb.from("ddt_righe").insert(payload);
    if(error){ alert("Errore: "+error.message); return; }
    render();
  };
}
// ============================================================
// ETICHETTE QR (per stampare un codice da attaccare fisicamente sul pezzo)
// ============================================================
async function stampaEtichetteQR(pezziDaStampare){
  if(typeof QRCode==="undefined"){ alert("La libreria per generare i QR non si è ancora caricata: riprova tra qualche secondo."); return; }
  let etichette;
  try{
    etichette = await Promise.all(pezziDaStampare.map(async p=>({
      dtr: p.dtr, articolo: articoloLabel(p.articolo_id),
      img: await QRCode.toDataURL(p.dtr, { width: 220, margin: 1 }),
    })));
  } catch(err){
    alert("Errore nella generazione dei QR: "+err.message);
    return;
  }
  const html = `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Etichette QR</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:20px;}
  .griglia{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .etichetta{border:1px dashed #999;border-radius:8px;padding:10px;text-align:center;page-break-inside:avoid;}
  .etichetta img{width:120px;height:120px;}
  .etichetta .dtr{font-weight:bold;margin-top:6px;font-size:13px;}
  .etichetta .art{font-size:11px;color:#555;}
  @media print{ button{display:none;} }
</style></head><body>
  <button onclick="window.print()" style="margin-bottom:16px;padding:10px 18px;font-size:14px;">Stampa queste etichette</button>
  <div class="griglia">
    ${etichette.map(e=>`<div class="etichetta"><img src="${e.img}"><div class="dtr">${escapeHtml(e.dtr)}</div><div class="art">${escapeHtml(e.articolo)}</div></div>`).join("")}
  </div>
</body></html>`;
  const w = window.open("", "_blank");
  if(!w){ alert("Il browser ha bloccato l'apertura della finestra. Consenti i popup per questo sito e riprova."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function stampaDDT(id){
  const dd = state.data.ddt.find(x=>x.id===id);
  if(!dd) return;
  const righe = state.data.ddtRighe.filter(r=>r.ddt_id===id);
  const cliente = state.data.clienti.find(c=>c.id===dd.cliente_id) || {};
  const righeHtml = righe.map(r=>`
    <tr><td>${r.articolo_id? escapeHtml(articoloLabel(r.articolo_id)) : "-"}</td><td>${escapeHtml(r.descrizione||"-")}</td><td style="text-align:right;">${r.quantita}</td></tr>`).join("");
  const html = `<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>DDT #${ddtNumero(dd.numero)}</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;color:#1c2530;margin:40px;}
  h1{font-size:22px;margin-bottom:0;}
  .sub{color:#66707d;margin-top:4px;margin-bottom:28px;}
  table{width:100%;border-collapse:collapse;margin-top:16px;}
  th,td{padding:8px 10px;border-bottom:1px solid #ddd;font-size:13px;text-align:left;}
  th{background:#f4f6f9;}
  .box{border:1px solid #ddd;border-radius:8px;padding:14px;margin-bottom:20px;}
  @media print{ button{display:none;} }
</style></head>
<body>
  <h1>Documento di Trasporto #${ddtNumero(dd.numero)}</h1>
  <p class="sub">Data apertura: ${fmtDate(dd.data_apertura)}${dd.data_chiusura? " — Chiuso il: "+fmtDate(dd.data_chiusura) : ""}</p>
  <div class="box">
    <strong>Cliente:</strong> ${escapeHtml(cliente.ragione_sociale||"-")}<br>
    ${cliente.indirizzo? `Indirizzo: ${escapeHtml(cliente.indirizzo)}<br>` : ""}
    ${cliente.piva? `P.IVA: ${escapeHtml(cliente.piva)}<br>` : ""}
    ${dd.cantiere_id? `Cantiere: ${escapeHtml(cantiereNome(dd.cantiere_id))}<br>` : ""}
    ${dd.causale? `Causale: ${escapeHtml(dd.causale)}<br>` : ""}
  </div>
  ${dd.note? `<p><em>${escapeHtml(dd.note)}</em></p>` : ""}
  <table>
    <thead><tr><th>Articolo</th><th>Descrizione</th><th style="text-align:right;">Quantità</th></tr></thead>
    <tbody>${righeHtml}</tbody>
  </table>
  <button onclick="window.print()" style="margin-top:20px;padding:10px 18px;font-size:14px;">Stampa questa pagina</button>
</body></html>`;
  const w = window.open("", "_blank");
  if(!w){ alert("Il browser ha bloccato l'apertura della finestra. Consenti i popup per questo sito e riprova."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

// REGISTRO MODIFICHE (solo admin)
// ============================================================
function nomeTabella(tb){
  const map = tr(
    { clienti:"Cliente", cantieri:"Cantiere", pezzi:"Pezzo (DTR)", articoli:"Articolo", service_orders:"Service Order", preventivi:"Preventivo", fatture:"Fattura", ddt:"DDT" },
    { clienti:"Client", cantieri:"Chantier", pezzi:"Pièce (DTR)", articoli:"Article", service_orders:"Ordre de service", preventivi:"Devis", fatture:"Facture", ddt:"BL" }
  );
  return map[tb] || tb;
}
function viewRegistroModifiche(){
  const filtro = state.filtroLogModifiche || "tutte";
  let rows = state.data.logModifiche;
  if(filtro!=="tutte") rows = rows.filter(l=>l.tabella===filtro);
  const tabelle = ["clienti","cantieri","pezzi","articoli","service_orders","preventivi","fatture","ddt"];
  return `
    <div class="card">
      <h2>Registro storico delle modifiche</h2>
      <p><small class="hint">Ogni riga mostra un campo cambiato: chi lo ha modificato, quando, il valore prima e dopo. Visibile solo all'amministratore.</small></p>
      <div class="pill-select" id="filtro-log">
        <button data-f="tutte" class="${filtro==="tutte"?"active":""}">Tutte</button>
        ${tabelle.map(t=>`<button data-f="${t}" class="${filtro===t?"active":""}">${nomeTabella(t)}</button>`).join("")}
      </div>
      ${exportButtonsHtml("exp-log")}
      ${rows.length===0? `<div class="empty">Nessuna modifica registrata.</div>` : `
      <table><thead><tr><th>Quando</th><th>Tabella</th><th>Campo</th><th>Prima</th><th>Dopo</th><th>Utente</th></tr></thead>
      <tbody>
        ${rows.map(l=>`
          <tr>
            <td>${fmtDate(l.created_at)}</td>
            <td>${escapeHtml(nomeTabella(l.tabella))}</td>
            <td>${escapeHtml(l.campo||"-")}</td>
            <td>${escapeHtml(l.valore_prima==null?"-":String(l.valore_prima).slice(0,60))}</td>
            <td>${escapeHtml(l.valore_dopo==null?"-":String(l.valore_dopo).slice(0,60))}</td>
            <td>${escapeHtml(nomeUtente(l.utente_id))}</td>
          </tr>
        `).join("")}
      </tbody></table>`}
    </div>
  `;
}
function wireRegistroModifiche(){
  document.querySelectorAll("#filtro-log button").forEach(b=>{
    b.onclick = ()=>{ state.filtroLogModifiche = b.dataset.f; render(); };
  });
  const rows = state.filtroLogModifiche && state.filtroLogModifiche!=="tutte"? state.data.logModifiche.filter(l=>l.tabella===state.filtroLogModifiche) : state.data.logModifiche;
  wireExportButtons("exp-log", "registro_modifiche", "Registro modifiche",
    ["Quando","Tabella","Campo","Prima","Dopo","Utente"],
    ()=>rows.map(l=>[fmtDate(l.created_at), nomeTabella(l.tabella), l.campo||"", l.valore_prima==null?"":String(l.valore_prima), l.valore_dopo==null?"":String(l.valore_dopo), nomeUtente(l.utente_id)])
  );
}

        ${rows.map(p=>`
          <tr>

                <option value="contabile" ${p.ruolo==="contabile"?"selected":""}>Contabile</option>

              </select>

        `).join("")}

    </div>
  `;
}
function wireUtenti(){
  document.querySelectorAll(".sel-ruolo").forEach(sel=>{
    sel.onchange = async ()=>{
      const { error } = await sb.from("profiles").update({ ruolo: sel.value }).eq("id", sel.dataset.id);
      if(error){ alert("Errore: "+error.message); render(); return; }
      render();
    };
  });
}
